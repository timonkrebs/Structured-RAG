services:
  # SQL Server database
  # SECURITY NOTE: The password below is for development only.
  # For production, use Docker secrets or environment variables from a secure source.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: structured-rag-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd  # TODO: Use secrets for production
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - structured-rag-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # .NET Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: structured-rag-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=StructuredRAG;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
    networks:
      - structured-rag-network
    restart: on-failure
    models:
      - qwen
      - granite
networks:
  structured-rag-network:
    driver: bridge

volumes:
  sqlserver-data:

models:
  qwen:
    model: ai/qwen3-reranker:latest
    context_size: 32768
  granite:
    model: ai/granite-4.0-nano:latest
    context_size: 32768