<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* {{include:_tokens.css}} */
  #root { padding: 16px 18px 14px; }
  /* FHNW signature CTA: yellow fill, near-black text. */
  button.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 600; box-shadow: 0 4px 14px rgba(253, 231, 14, 0.35);
  }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

  .header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1, .timetable h2, .block-list h2 {
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: -0.01em;
  }
  /* Yellow brand bar — echoes the mark in the FHNW logo. */
  h1, .timetable h2, .block-list h2 { position: relative; padding-left: 13px; }
  h1::before, .timetable h2::before, .block-list h2::before {
    content: ""; position: absolute; left: 0; top: 0.16em; bottom: 0.12em;
    width: 5px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent-hover), var(--accent));
  }
  .header h1 { font-size: 15.5px; font-weight: 600; margin: 0; }
  .header .sub { color: var(--muted); font-size: 12px; }

  .meter-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 12px 0 4px;
  }
  .meter {
    flex: 1 1 160px; height: 9px; border-radius: 999px; background: var(--plane);
    box-shadow: inset 0 0 0 1px var(--hairline); overflow: hidden; display: flex;
  }
  .meter .fill {
    background: linear-gradient(90deg, var(--accent), var(--accent-hover));
    border-radius: 999px 0 0 999px;
  }
  .meter .over { background: var(--warn); border-left: 2px solid transparent; }
  .meter-label { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .meter-label .of { color: var(--muted); font-weight: 400; }
  .target-wrap { color: var(--ink-2); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
  .target-wrap input {
    width: 54px; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 3px 7px;
    font-variant-numeric: tabular-nums;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .target-wrap input:hover { border-color: var(--accent); }
  .hint { font-size: 12.5px; color: var(--ink-2); margin: 3px 0; }
  .hint.reached { color: var(--good-text); }
  /* Clash warning as an alert strip (warn bar on the left) with quick fixes. */
  .hint.clash-line {
    border-left: 3px solid var(--warn);
    background: var(--plane); border-radius: 0 8px 8px 0;
    padding: 5px 9px; margin: 6px 0;
  }
  .clash-fixes { display: inline-flex; gap: 5px; margin-left: 6px; flex-wrap: wrap; }
  .clash-fix { font-size: 11.5px; padding: 1px 8px; }

  .legend { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }

  /* Plan ⇄ catalog switch. The widget opens on the student's plan and keeps the
     full list one click away (issue #34) — a segmented control rather than a
     checkbox, so both counts are readable without toggling anything. */
  .view-switch {
    display: inline-flex; gap: 2px; margin: 4px 0 2px; padding: 2px;
    border: 1px solid var(--hairline); border-radius: 999px; background: var(--plane);
  }
  .view-switch button {
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    padding: 3px 11px; font-size: 12.5px; color: var(--ink-2); box-shadow: none;
  }
  .view-switch button:hover { background: var(--glass-hi); border-color: transparent; transform: none; }
  .view-switch button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-soft);
  }

  ul.modules { list-style: none; margin: 8px 0 0; padding: 0; }
  ul.modules > li { border-top: 1px solid var(--hairline); padding: 10px 4px; }
  ul.modules > li.selected {
    box-shadow: inset 4px 0 0 var(--accent);
    background: var(--accent-soft); border-radius: 0 10px 10px 0;
  }
  /* Transient cue after jumping here from a timetable block; an outline pulse
     doesn't fight the persistent .selected background. */
  @keyframes nav-flash { from { outline-color: var(--accent); } to { outline-color: transparent; } }
  ul.modules > li.nav-flash {
    outline: 2px solid transparent; outline-offset: -2px; border-radius: 8px;
    animation: nav-flash 1.6s ease-out;
  }
  .mod-row { display: flex; align-items: flex-start; gap: 9px; }
  .mod-row input[type="checkbox"] { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--check); flex: none; }
  .mod-main { flex: 1 1 auto; min-width: 0; }
  .mod-title { font-weight: 600; }
  .mod-title .code { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip {
    display: inline-block; font-size: 11.5px; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 0 8px; line-height: 17px;
    white-space: nowrap; background: var(--plane);
  }
  .chip.ects {
    font-variant-numeric: tabular-nums; font-weight: 600;
    background: #141414; color: #fde70e; border-color: transparent;
  }
  .chip.day { background: var(--plane); }
  .chip.match {
    border-color: var(--accent-text); color: var(--accent-text);
    background: var(--accent-soft);
  }
  /* Stands for the slot chips it replaces on modules with many parallel
     classes; the full list is its title. */
  .chip.more { border-style: dashed; cursor: help; }
  .mod-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .mod-note.warn-note::before { content: "△ "; }
  /* Two lines are enough to tell modules apart while scanning a category —
     at ~400 characters the compiled summaries otherwise make every row a
     paragraph. Opening "Details" unclamps the row (li.expanded). */
  .mod-summary {
    font-size: 12.5px; color: var(--ink-2); margin-top: 4px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  ul.modules > li.expanded .mod-summary { display: block; }
  .mod-actions { flex: none; }
  .mod-actions button { font-size: 12px; padding: 3px 9px; }

  .details-panel {
    margin: 8px 0 0 24px; padding: 9px 11px; font-size: 12.5px;
    border: 1px solid var(--glass-border); border-radius: 12px;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    overflow-wrap: break-word; max-height: 260px; overflow-y: auto;
  }
  .details-panel a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
  .details-panel p { margin: 0 0 6px; }
  .details-panel p:last-child { margin-bottom: 0; }
  .details-panel ul { margin: 0 0 6px; padding-left: 18px; }
  .details-panel li { margin: 2px 0; }
  .details-panel .md-h { font-weight: 600; margin: 8px 0 4px; }
  .details-panel .md-h:first-child { margin-top: 0; }

  details.blocked { margin-top: 12px; border-top: 1px solid var(--hairline); padding-top: 9px; }
  details.blocked summary { cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13px; }

  details.cat { border-top: 1px solid var(--hairline); margin-top: 8px; padding-top: 7px; }
  details.cat > summary { cursor: pointer; font-size: 13px; }
  details.cat > summary .cat-title {
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 600; letter-spacing: -0.01em;
  }
  details.cat > summary .cat-count { color: var(--ink-2); font-size: 12px; margin-left: 6px; }
  details.cat > .modules { margin-top: 4px; }

  .class-pick {
    font: inherit; font-size: 12px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 3px 7px;
    margin-top: 4px; max-width: 100%;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .class-pick:hover { border-color: var(--accent); }

  .timetable { border-top: 1px solid var(--hairline); margin-top: 14px; padding-top: 10px; }
  .timetable h2 { font-size: 13px; font-weight: 600; margin: 0 0 7px; }

  .block-list { border-top: 1px solid var(--hairline); margin-top: 14px; padding-top: 10px; }
  .block-list h2 { font-size: 13px; font-weight: 600; margin: 0 0 7px; }
  .block-list h2 .sum { color: var(--muted); font-weight: 400; }
  .block-list ul { list-style: none; margin: 0; padding: 0; }
  .block-list li { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 3px 0; font-size: 12.5px; }
  .block-list .code { color: var(--muted); font-size: 12px; }
  .tt { display: flex; gap: 5px; }
  .tt-axis { flex: none; width: 36px; }
  .tt-axis .tt-head { height: 20px; }
  .tt-axis .tt-scale { position: relative; font-size: 10.5px; color: var(--muted); }
  .tt-axis .tt-scale span {
    position: absolute; right: 6px; transform: translateY(-50%);
    font-variant-numeric: tabular-nums;
  }
  .tt-day { flex: 1 1 0; min-width: 0; }
  .tt-day .tt-head {
    height: 20px; text-align: center; font-size: 11.5px; color: var(--ink-2); font-weight: 600;
  }
  .tt-col {
    position: relative; border: 1px solid var(--hairline); border-radius: 8px;
    background: var(--plane);
  }
  .tt-block {
    position: absolute; overflow: hidden;
    background: var(--accent-soft); border: 1px solid var(--accent-edge); border-radius: 6px;
    font-size: 10.5px; line-height: 1.3; padding: 2px 5px;
    cursor: pointer; overflow-wrap: anywhere; color: var(--ink);
    transition: box-shadow 0.12s ease;
  }
  .tt-block:hover { box-shadow: 0 2px 8px rgba(20, 20, 20, 0.18); }
  .tt-block .tt-time { font-variant-numeric: tabular-nums; color: var(--ink-2); display: block; }
  /* Overlaps are also always reported as a text hint above the list — never color alone. */
  .tt-block.clash { border-color: var(--warn); box-shadow: inset 0 0 0 1px var(--warn); }

  /* Sticky glass action bar: the selection summary + send CTA stay visible
     while scrolling through long module lists. */
  .footer {
    position: sticky; bottom: 6px; z-index: 6;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-top: 14px; padding: 8px 10px;
    background: var(--glass-hi);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .footer .spacer { flex: 1 1 auto; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  // {{include:_host.js}}

  var STR = {
    de: {
      title: function (s) { return "Semesterplan " + s; },
      eligibleCount: function (n) { return n + " wählbare Module"; },
      covEligible: function (n) { return n + " wählbar"; },
      covBlocked: function (n) { return n + " mit offenen Voraussetzungen"; },
      covNotOffered: function (n, sem) { return n + " im " + sem + " nicht angeboten"; },
      covCompleted: function (n) { return n + " abgeschlossen"; },
      target: "Ziel",
      ects: "ECTS",
      overTarget: function (n) { return "⚠ " + n + " ECTS über dem Ziel"; },
      reached: "✓ Ziel erreicht",
      remaining: function (n) { return "Noch " + n + " ECTS bis zum Ziel"; },
      proposalHint: "✨ Vorschlag deines Assistenten vorausgewählt — passe die Auswahl an.",
      noFixedDay: "unregelm.",
      blockList: "Gewählte Blockmodule (kein fester Wochentag)",
      flexNote: "Tipp: Module mit unregelmässigen Terminen belegen keinen festen Wochenslot — konkrete Blocktermine auf der Modulseite prüfen, Überschneidungen bleiben möglich.",
      clash: function (day, titles) { return "⚠ Zeitkonflikt (" + day + "): " + titles; },
      clashSoft: function (day, titles) { return "△ Gleicher Wochentag (" + day + "), Zeiten unvollständig: " + titles; },
      unselect: function (code) { return code + " abwählen"; },
      timetable: "Stundenplan",
      chooseClass: "Anlass wählen",
      viewSwitch: "Ansicht",
      viewPlan: function (n) { return "Mein Plan · " + n; },
      viewAll: function (n) { return "Alle Module · " + n; },
      planEmpty: "Noch nichts gewählt — unter „Alle Module“ auswählen oder den Assistenten im Chat um einen Vorschlag bitten.",
      classCount: function (n) { return n + " Anlässe"; },
      slotCount: function (n) { return n + " Termine"; },
      everyNDays: function (n) { return "alle " + n + " Tage"; },
      matchLegend: "★ = passt zu deinen Interessen",
      otherCat: "Weitere Module",
      catCount: function (n, sel, ects) {
        return n + (n === 1 ? " Modul" : " Module") + (sel > 0 ? " · " + sel + " gewählt (" + ects + " ECTS)" : "");
      },
      missingRec: function (codes) { return "Empfohlen, aber noch nicht absolviert: " + codes; },
      prereqNotes: "Hinweis zu Voraussetzungen: ",
      details: "Details",
      hide: "Zuklappen",
      loading: "Lade offizielle Beschreibung…",
      loadError: "Details konnten nicht geladen werden.",
      official: "Offizielle Modulseite ↗",
      blocked: function (n) { return "Module mit offenen Voraussetzungen (" + n + ")"; },
      missing: "fehlt: ",
      openPrereq: function (txt) { return "Voraussetzungen offen: " + txt; },
      orSep: " oder ",
      selectedSum: function (n, e) { return n + " Module · " + e + " ECTS gewählt"; },
      send: "Plan in den Chat senden",
      noData: "Keine Plandaten vorhanden — bitte zuerst plan_semester aufrufen.",
      noEligible: "Keine wählbaren Module für dieses Semester gefunden.",
      followUp: function (sem, lines, sum, target) {
        return "Ich habe im Planungs-Widget folgenden Semesterplan für " + sem +
          " zusammengestellt (" + sum + " von " + target + " ECTS):\n" + lines +
          "\nBitte beurteile den Plan (Voraussetzungen, Arbeitslast, Kombination) und schlage konkrete Verbesserungen vor.";
      }
    },
    en: {
      title: function (s) { return "Semester plan " + s; },
      eligibleCount: function (n) { return n + " eligible modules"; },
      covEligible: function (n) { return n + " eligible"; },
      covBlocked: function (n) { return n + " with open prerequisites"; },
      covNotOffered: function (n, sem) { return n + " not offered in " + sem; },
      covCompleted: function (n) { return n + " completed"; },
      target: "Target",
      ects: "ECTS",
      overTarget: function (n) { return "⚠ " + n + " ECTS over target"; },
      reached: "✓ Target reached",
      remaining: function (n) { return n + " ECTS to go to reach the target"; },
      proposalHint: "✨ Your assistant's proposal is preselected — adjust it as you like.",
      noFixedDay: "irreg.",
      blockList: "Selected block modules (no fixed weekday)",
      flexNote: "Tip: modules with irregular dates take no fixed weekly slot — check their actual block dates on the module page, overlaps remain possible.",
      clash: function (day, titles) { return "⚠ Time clash (" + day + "): " + titles; },
      clashSoft: function (day, titles) { return "△ Same weekday (" + day + "), times incomplete: " + titles; },
      unselect: function (code) { return "drop " + code; },
      timetable: "Timetable",
      chooseClass: "Choose class",
      viewSwitch: "View",
      viewPlan: function (n) { return "My plan · " + n; },
      viewAll: function (n) { return "All modules · " + n; },
      planEmpty: "Nothing selected yet — pick modules under “All modules”, or ask your assistant in the chat for a proposal.",
      classCount: function (n) { return n + " classes"; },
      slotCount: function (n) { return n + " sessions"; },
      everyNDays: function (n) { return "every " + n + " days"; },
      matchLegend: "★ = matches your interests",
      otherCat: "Other modules",
      catCount: function (n, sel, ects) {
        return n + (n === 1 ? " module" : " modules") + (sel > 0 ? " · " + sel + " selected (" + ects + " ECTS)" : "");
      },
      missingRec: function (codes) { return "Recommended but not yet completed: " + codes; },
      prereqNotes: "Prerequisite note: ",
      details: "Details",
      hide: "Hide",
      loading: "Loading official description…",
      loadError: "Could not load details.",
      official: "Official module page ↗",
      blocked: function (n) { return "Modules with open prerequisites (" + n + ")"; },
      missing: "missing: ",
      openPrereq: function (txt) { return "prerequisites open: " + txt; },
      orSep: " or ",
      selectedSum: function (n, e) { return n + " modules · " + e + " ECTS selected"; },
      send: "Send plan to chat",
      noData: "No planning data — call plan_semester first.",
      noEligible: "No eligible modules found for this semester.",
      followUp: function (sem, lines, sum, target) {
        return "Using the planning widget I assembled this plan for " + sem +
          " (" + sum + " of " + target + " ECTS):\n" + lines +
          "\nPlease review the plan (prerequisites, workload, combination) and suggest concrete improvements.";
      }
    }
  };
  function t() { return isDe() ? STR.de : STR.en; }

  // ---------- state ----------
  var selected = {};          // code -> true
  var expanded = {};          // code -> true (details panel open)
  var details = {};           // code -> {loading|error|text,url}
  var chosenClass = {};       // code -> class number (when a module has parallel classes)
  var target = 30;
  var targetTouched = false;
  var stateRestored = false;
  var blockedOpen = false;  // survives re-renders (hosts re-render on any global change)
  var catOpen = {};         // category label -> open (accordion state, survives re-renders)
  var catInit = false;      // defaults computed once, afterwards purely student-driven
  var proposalApplied = false;  // the assistant's proposal initialized the selection
  var showAll = null;       // false = plan view, true = full list; null = decide on first render
  var viewTouched = false;  // the student picked the view themselves — persist it
  var keepVisible = {};     // code -> true: unticked in the plan view, still listed (undo)

  function data() { return Host.toolOutput; }

  function restoreState() {
    if (stateRestored) return;
    var d = data();
    if (d && typeof d.ectsTarget === "number" && d.ectsTarget > 0) target = d.ectsTarget;
    var ws = Host.widgetState;
    if (ws) {
      (ws.selectedCodes || []).forEach(function (c) { selected[c] = true; });
      // Older persisted drafts have no chosenClasses — modules then use their first class.
      if (ws.chosenClasses && typeof ws.chosenClasses === "object") {
        Object.keys(ws.chosenClasses).forEach(function (c) { chosenClass[c] = ws.chosenClasses[c]; });
      }
      if (typeof ws.ectsTarget === "number" && ws.ectsTarget > 0) { target = ws.ectsTarget; targetTouched = true; }
      if (typeof ws.showAll === "boolean") { showAll = ws.showAll; viewTouched = true; }
    } else if (d && (d.proposed || []).length > 0) {
      // First render without a saved draft: start from the assistant's proposal.
      // A saved draft (even an empty selection) is the student's own state and wins.
      d.proposed.forEach(function (c) { selected[c] = true; });
      // Classes the assistant pinned explicitly (proposedClasses) win over the
      // clash-free auto-pick — the widget must open with the exact Durchführung
      // the assistant reasoned about, not an arbitrary first class.
      var pins = d.proposedClasses || {};
      Object.keys(pins).forEach(function (c) { chosenClass[c] = pins[c]; });
      autoPickClasses();
      proposalApplied = true;
    }
    if (d) stateRestored = true;
  }

  // A proposal names module codes, not class groups — the default (first) class of
  // a parallel-class module can clash with the other proposed modules even when
  // another alternative is free. Greedily pick the first clash-free class per
  // module so the plan opens the way the assistant meant it; the student can
  // still switch classes, and when every alternative clashes the default stays
  // (the clash hints say so). Modules whose class is already pinned are skipped.
  function autoPickClasses() {
    var mods = selectedModules();
    mods.forEach(function (m) {
      var groups = lessonGroups(m);
      if (groups.length < 2 || chosenClass[m.code]) return;
      var others = selectedSlots(mods.filter(function (o) { return o.code !== m.code; }));
      for (var i = 0; i < groups.length; i++) {
        var hard = groups[i].some(function (l) {
          if (!l.day) return false;
          var s = toMin(l.start), e = toMin(l.end);
          if (s == null || e == null) return false;
          return others.some(function (b) {
            return b.day === l.day && b.s != null && b.e != null && s < b.e && b.s < e;
          });
        });
        if (!hard) {
          if (i > 0) chosenClass[m.code] = groupKey(groups[i], i);
          return;
        }
      }
    });
  }

  function persistState() {
    var state = { selectedCodes: Object.keys(selected) };
    if (Object.keys(chosenClass).length > 0) state.chosenClasses = chosenClass;
    if (targetTouched) state.ectsTarget = target;
    if (viewTouched) state.showAll = showAll;
    Host.setState(state, draftSummary());
  }

  // Model-facing summary of the current draft (used as MCP Apps model context).
  function draftSummary() {
    var mods = selectedModules();
    if (mods.length === 0) return "";
    var sum = mods.reduce(function (a, m) { return a + (m.ects || 0); }, 0);
    return "Student's current draft plan in the semester-planner widget (" + sum + "/" + target +
      " ECTS): " + mods.map(function (m) {
        var slots = chosenLessons(m).filter(function (l) { return l.day; })
          .map(function (l) { return l.day + (l.start ? " " + l.start + "-" + (l.end || "?") : ""); }).join(", ");
        var open = openPrereqOf(m.code);
        return m.code + (slots ? " (" + slots + ")" : "") +
          (open ? " [prerequisites open: " + open + "]" : "");
      }).join(", ");
  }

  // Blocked modules are selectable too — a student may satisfy a requirement in a
  // way the strict module graph cannot see — so eligible and blocked share one
  // entry shape for rendering and selection; blocked entries additionally carry
  // their open prerequisite groups. Fallbacks cover payloads of older servers:
  // flat missingPrerequisites lists and blocked rows without a module summary
  // (those render, but without lessons they stay out of the timetable).
  function blockedEntries() {
    var d = data();
    return ((d && d.blocked) || []).map(function (b) {
      var groups = b.missingPrerequisiteGroups ||
        (b.missingPrerequisites || []).map(function (c) { return [c]; });
      return { module: b.module || b, interestMatches: [], missingRecommended: [], missingGroups: groups };
    });
  }
  function allEntries() {
    var d = data();
    return ((d && d.eligible) || []).concat(blockedEntries());
  }
  function missingText(groups) {
    var s = t();
    return groups.map(function (g) { return g.join(s.orSep); }).join(", ");
  }
  // The open prerequisite text of a blocked module, null for eligible ones.
  function openPrereqOf(code) {
    var hit = blockedEntries().filter(function (e) { return e.module.code === code; })[0];
    return hit && hit.missingGroups.length > 0 ? missingText(hit.missingGroups) : null;
  }
  function selectedModules() {
    return allEntries().map(function (e) { return e.module; })
      .filter(function (m) { return selected[m.code]; });
  }
  // ---------- lessons ----------
  // A module's lessons come one entry per weekly class slot; slots sharing `number`
  // belong to the same class (Modulanlass) and the student attends ONE class.
  // Groups therefore are the student's alternatives for a module.
  function lessonGroups(m) {
    var groups = [], byNum = {};
    (m.lessons || []).forEach(function (l) {
      var key = l.number || ("~" + groups.length);
      if (!byNum[key]) { byNum[key] = []; groups.push(byNum[key]); }
      byNum[key].push(l);
    });
    return groups;
  }
  // Stable key of a class group for state/select values; classes without an official
  // number fall back to their position.
  function groupKey(g, i) { return g[0].number || ("#" + i); }
  function chosenLessons(m) {
    var groups = lessonGroups(m);
    if (groups.length === 0) return [];
    var want = chosenClass[m.code];
    for (var i = 0; want && i < groups.length; i++) {
      if (groupKey(groups[i], i) === want) return groups[i];
    }
    return groups[0];
  }
  function toMin(hm) {
    var p = /^(\d{1,2}):(\d{2})$/.exec(hm || "");
    return p ? (+p[1]) * 60 + (+p[2]) : null;
  }
  function lessonLabel(l) {
    var s = t();
    // Block courses publish times without a weekday — say so instead of a cryptic "?".
    var label = l.day ? day(l.day) : s.noFixedDay;
    if (l.start) label += " " + l.start + "–" + (l.end || "?");
    // Only annotate a real non-weekly rhythm. 7 = weekly (the default, no annotation);
    // FHNW also emits sentinel values (0, -2, …) that are not day intervals — never
    // render "every -2 days".
    if (l.periodicity > 0 && l.periodicity !== 7) label += " · " + s.everyNDays(l.periodicity);
    return label;
  }

  // The chosen class slots of the selected modules, flattened for clash/timetable use.
  // Modules without lesson data fall back to bare weekday entries (times null).
  function selectedSlots(mods) {
    var slots = [];
    mods.forEach(function (m) {
      var ls = chosenLessons(m).filter(function (l) { return l.day; });
      if (ls.length === 0) {
        (m.weekdays || []).forEach(function (d) { slots.push({ m: m, day: d, s: null, e: null, l: null }); });
      } else {
        ls.forEach(function (l) { slots.push({ m: m, day: l.day, s: toMin(l.start), e: toMin(l.end), l: l }); });
      }
    });
    return slots;
  }

  // Pairwise: a hard clash needs overlapping times on the same day; when either side
  // has no times, same-day is only a soft "possible clash" hint.
  function clashes(mods) {
    var slots = selectedSlots(mods);
    var out = [], seen = {};
    for (var i = 0; i < slots.length; i++) {
      for (var j = i + 1; j < slots.length; j++) {
        var a = slots[i], b = slots[j];
        if (a.m.code === b.m.code || a.day !== b.day) continue;
        var timed = a.s != null && a.e != null && b.s != null && b.e != null;
        if (timed && !(a.s < b.e && b.s < a.e)) continue;
        var key = a.day + "|" + a.m.code + "|" + b.m.code + "|" + timed;
        if (seen[key]) continue;
        seen[key] = true;
        out.push({ day: a.day, a: a, b: b, hard: timed });
      }
    }
    return out;
  }

  // Category order in the accordion: mandatory first, then the elective tiers,
  // then anything else alphabetically. Labels are the catalog's own type names.
  var TYPE_RANK = { "pflichtmodul": 0, "wahlpflichtmodul": 1, "wahlmodul": 2 };
  function groupByType(eligible, s) {
    var map = {}, order = [];
    eligible.forEach(function (e) {
      var label = e.module.moduleType || s.otherCat;
      if (!map[label]) { map[label] = []; order.push(label); }
      map[label].push(e);
    });
    order.sort(function (a, b) {
      var ra = TYPE_RANK[a.toLowerCase()], rb = TYPE_RANK[b.toLowerCase()];
      ra = ra === undefined ? 9 : ra; rb = rb === undefined ? 9 : rb;
      return ra - rb || a.localeCompare(b);
    });
    return order.map(function (label) { return { label: label, entries: map[label] }; });
  }

  // The accordion starts fully collapsed (issue #30): the per-category counters
  // ("n gewählt · x ECTS") and the ★ marker still show where a proposal or the
  // interest matches landed without pushing the list open. Afterwards the
  // accordion is purely student-driven and survives host re-renders.
  function initCatOpen(cats) {
    if (catInit) return;
    cats.forEach(function (c) { catOpen[c.label] = false; });
    catInit = true;
  }

  // The plan view lists exactly what is in the plan — eligible and blocked
  // modules alike, in the accordion's category order so both views agree on
  // where a module sits. Modules unticked while in this view stay listed
  // (keepVisible): the row would otherwise vanish under the click, and taking
  // that back would mean hunting for it in the full list.
  function planEntries(s) {
    var d = data();
    var out = [];
    groupByType(d && d.eligible ? d.eligible : [], s).forEach(function (c) {
      c.entries.forEach(function (e) { out.push(e); });
    });
    blockedEntries().forEach(function (e) { out.push(e); });
    return out.filter(function (e) { return selected[e.module.code] || keepVisible[e.module.code]; });
  }

  function viewButton(id, label, on) {
    return '<button data-view="' + id + '" aria-pressed="' + (on ? "true" : "false") + '">' +
      esc(label) + "</button>";
  }

  // ---------- rendering ----------
  function render() {
    hostRenderDeferred = false; // any render satisfies a pending host update
    restoreState();
    var root = document.getElementById("root");
    var d = data();
    var s = t();
    if (!d || !Array.isArray(d.eligible)) {
      // In MCP Apps the tool result arrives asynchronously after ui/initialize —
      // don't flash the "no data" message while waiting.
      root.innerHTML = '<div class="empty">' + esc(Host.mode === "mcp" && !Host.ready ? "…" : s.noData) + "</div>";
      reportSize();
      return;
    }

    var mods = selectedModules();
    var sum = mods.reduce(function (a, m) { return a + (m.ects || 0); }, 0);
    var anyMatches = (d.eligible || []).some(function (e) { return (e.interestMatches || []).length > 0; });
    // Which view the student lands in, decided once: with something to show —
    // the assistant's proposal or a restored draft — that is the plan itself
    // (issue #34: a semester's full offering is not an overview), otherwise the
    // full list, because there would be nothing else to look at.
    if (showAll === null) showAll = Object.keys(selected).length === 0;

    var html = "";

    // Header + ECTS meter (single-value meter: accent fill, warning overflow segment;
    // over/reached is always also said in text — never color alone).
    // With coverage counts (newer server), the subtitle explains where the whole
    // catalog went — a short eligible list is otherwise inexplicable to students.
    var subText;
    if (typeof d.notOfferedCount === "number") {
      var cov = [s.covEligible((d.eligible || []).length), s.covBlocked((d.blocked || []).length),
                 s.covNotOffered(d.notOfferedCount, d.semester)];
      if (d.completedCount > 0) cov.push(s.covCompleted(d.completedCount));
      subText = cov.join(" · ");
    } else {
      subText = s.eligibleCount((d.eligible || []).length);
    }
    html += '<div class="header"><h1>' + esc(s.title(d.semester)) + "</h1>" +
      '<span class="sub">' + esc(subText) + "</span></div>";

    // Up to the target the bar tracks sum/target; over target the full bar
    // represents `sum`, split into the target part (accent) and overflow (warning).
    var basePct = sum <= target ? (target > 0 ? (sum / target) * 100 : 0) : (target / sum) * 100;
    var overPct = sum > target ? ((sum - target) / sum) * 100 : 0;
    html += '<div class="meter-row">' +
      '<span class="meter-label" aria-live="polite">' + sum + ' <span class="of">/ ' + target + " " + esc(s.ects) + "</span></span>" +
      '<div class="meter"><div class="fill" style="width:' + basePct.toFixed(1) + '%"></div>' +
      (overPct > 0 ? '<div class="over" style="width:' + overPct.toFixed(1) + '%"></div>' : "") + "</div>" +
      '<label class="target-wrap">' + esc(s.target) +
      ' <input id="target" type="number" min="1" max="90" step="1" value="' + target + '"></label>' +
      "</div>";
    if (proposalApplied) html += '<div class="hint">' + esc(s.proposalHint) + "</div>";
    if (sum > target) html += '<div class="hint">' + esc(s.overTarget(sum - target)) + "</div>";
    else if (sum === target && sum > 0) html += '<div class="hint reached">' + esc(s.reached) + "</div>";
    else if (sum > 0 && sum < target) {
      html += '<div class="hint">' + esc(s.remaining(target - sum)) + "</div>";
      var hasUnselectedFlexible = (d.eligible || []).some(function (e) {
        return !selected[e.module.code] && isFlexible(e.module);
      });
      if (hasUnselectedFlexible) html += '<div class="hint">' + esc(s.flexNote) + "</div>";
    }

    clashes(mods).forEach(function (c) {
      var part = function (x) {
        return locTitle(x.m) + (x.l && x.l.start ? " (" + x.l.start + "–" + (x.l.end || "?") + ")" : "");
      };
      var titles = part(c.a) + " + " + part(c.b);
      // Quick-fix right in the warning: each clashing module gets a drop button.
      html += '<div class="hint clash-line" role="alert">' + esc((c.hard ? s.clash : s.clashSoft)(day(c.day), titles)) +
        '<span class="clash-fixes">' +
        '<button class="clash-fix" data-unselect="' + esc(c.a.m.code) + '">' + esc(s.unselect(c.a.m.code)) + "</button>" +
        '<button class="clash-fix" data-unselect="' + esc(c.b.m.code) + '">' + esc(s.unselect(c.b.m.code)) + "</button>" +
        "</span></div>";
    });

    if (anyMatches) html += '<div class="legend">' + esc(s.matchLegend) + "</div>";

    // Eligible AND blocked modules share this renderer. One <li> per module; inside
    // the category accordion the per-module type chip is dropped — the category
    // header already names it. Blocked entries carry missingGroups and get a
    // warning note; data-mod anchors the row for timetable-click navigation.
    function moduleLi(e, hideTypeChip) {
      var m = e.module;
      var isSel = !!selected[m.code];
      var matches = {};
      (e.interestMatches || []).forEach(function (tag) { matches[tag.toLowerCase()] = true; });

      return '<li data-mod="' + esc(m.code) + '" class="' + (isSel ? "selected " : "") +
        (expanded[m.code] ? "expanded" : "") + '">' +
        '<div class="mod-row">' +
        '<input type="checkbox" data-toggle="' + esc(m.code) + '"' + (isSel ? " checked" : "") + ">" +
        '<div class="mod-main">' +
        '<div class="mod-title">' + esc(locTitle(m)) + '<span class="code">' + esc(m.code) + "</span></div>" +
        '<div class="badges">' +
        '<span class="chip ects">' + m.ects + " " + esc(s.ects) + "</span>" +
        (m.moduleType && !hideTypeChip ? '<span class="chip">' + esc(m.moduleType) + "</span>" : "") +
        scheduleChips(m, isSel) +
        (m.tags || []).map(function (tag) {
          var hit = matches[tag.toLowerCase()];
          return '<span class="chip' + (hit ? " match" : "") + '">' + (hit ? "★ " : "") + esc(tag) + "</span>";
        }).join("") +
        "</div>" +
        (isSel && lessonGroups(m).length > 1 ? classPicker(m) : "") +
        '<div class="mod-summary">' + esc(locSummary(m)) + "</div>" +
        ((e.missingGroups || []).length
          ? '<div class="mod-note warn-note">' + esc(s.missing) + esc(missingText(e.missingGroups)) + "</div>" : "") +
        ((e.missingRecommended || []).length
          ? '<div class="mod-note warn-note">' + esc(s.missingRec(e.missingRecommended.join(", "))) + "</div>" : "") +
        (m.prerequisiteNotes
          ? '<div class="mod-note warn-note">' + esc(s.prereqNotes) + esc(m.prerequisiteNotes) + "</div>" : "") +
        "</div>" +
        '<div class="mod-actions"><button data-details="' + esc(m.code) + '">' +
        esc(expanded[m.code] ? s.hide : s.details) + "</button></div>" +
        "</div>" +
        detailsPanel(m) +
        "</li>";
    }

    // Plan ⇄ catalog switch. Both counts are on the buttons, so what the other
    // view holds is readable without switching to it.
    var bEntries = blockedEntries();
    html += '<div class="view-switch" role="group" aria-label="' + esc(s.viewSwitch) + '">' +
      viewButton("plan", s.viewPlan(mods.length), !showAll) +
      viewButton("all", s.viewAll((d.eligible || []).length + bEntries.length), showAll) +
      "</div>";

    if (!showAll) {
      // Plan view: the week grid comes first — with only the chosen modules
      // below it, the timetable is the overview the student came for, and the
      // list underneath is what they adjust.
      html += timetableHtml(mods);
      html += blockListHtml(mods);
      var plan = planEntries(s);
      html += plan.length === 0
        ? '<div class="empty">' + esc(s.planEmpty) + "</div>"
        : '<ul class="modules">' + plan.map(function (e) { return moduleLi(e, false); }).join("") + "</ul>";
    } else {
      if ((d.eligible || []).length === 0) {
        html += '<div class="empty">' + esc(s.noEligible) + "</div>";
      } else {
        var cats = groupByType(d.eligible, s);
        initCatOpen(cats);
        if (cats.length === 1) {
          // A single category (e.g. catalogs without module types) needs no accordion.
          html += '<ul class="modules">' + cats[0].entries.map(function (e) { return moduleLi(e, false); }).join("") + "</ul>";
        } else {
          cats.forEach(function (c) {
            var selCount = 0, selEcts = 0;
            c.entries.forEach(function (e) {
              if (selected[e.module.code]) { selCount++; selEcts += e.module.ects || 0; }
            });
            var catMatch = c.entries.some(function (e) { return (e.interestMatches || []).length > 0; });
            html += '<details class="cat" data-cat="' + esc(c.label) + '"' + (catOpen[c.label] ? " open" : "") + ">" +
              '<summary><span class="cat-title">' + (catMatch ? "★ " : "") + esc(c.label) + "</span>" +
              '<span class="cat-count">' + esc(s.catCount(c.entries.length, selCount, selEcts)) + "</span></summary>" +
              '<ul class="modules">' + c.entries.map(function (e) { return moduleLi(e, true); }).join("") + "</ul>" +
              "</details>";
          });
        }
      }

      html += timetableHtml(mods);
      html += blockListHtml(mods);

      // Blocked modules: selectable like eligible ones (a student may satisfy a
      // requirement in a way the module graph cannot see), rendered by the same
      // moduleLi — including checkbox, class picker and the open-prerequisites
      // note. In the plan view the selected ones sit in the list above instead.
      if (bEntries.length > 0) {
        html += '<details class="blocked"' + (blockedOpen ? " open" : "") + "><summary>" + esc(s.blocked(bEntries.length)) + "</summary>" +
          '<ul class="modules">' + bEntries.map(function (e) { return moduleLi(e, false); }).join("") + "</ul></details>";
      }
    }

    // Footer
    html += '<div class="footer">' +
      '<span class="sub" style="color:var(--ink-2)" aria-live="polite">' + esc(s.selectedSum(mods.length, sum)) + "</span>" +
      '<span class="spacer"></span>' +
      '<button id="send" class="primary"' + (mods.length === 0 ? " disabled" : "") + ">" + esc(s.send) + "</button>" +
      "</div>";

    root.innerHTML = html;
    reportSize();
    // The row a timetable click is navigating to was just rebuilt — re-apply the
    // flash and, if the frame has caught up with the reported size, the scroll.
    revealNav();
  }

  // Day/time chips: with lesson slots each class slot gets a chip incl. times;
  // catalogs without lesson data keep the plain weekday chips.
  //
  // A module can publish a dozen parallel classes (Anlässe) — Angewandte
  // Mathematik 1 has twelve — and spelling every one of them out is what turns
  // the list into a wall of times (issue #34). So a row shows at most CHIP_LIMIT
  // slots: beyond that it collapses to the weekdays the module can be attended
  // on plus how many classes there are, with the full list on hover. A selected
  // row (chosenOnly) shows only the class it actually occupies in the timetable
  // — the alternatives live in the class picker right below it.
  var CHIP_LIMIT = 3;
  function uniq(list) {
    var seen = {}, out = [];
    list.forEach(function (x) { if (!seen[x]) { seen[x] = true; out.push(x); } });
    return out;
  }
  function dayChips(labels) {
    return labels.map(function (l) { return '<span class="chip day">' + esc(l) + "</span>"; }).join("");
  }
  function scheduleChips(m, chosenOnly) {
    var s = t();
    var groups = lessonGroups(m);
    var source = chosenOnly && groups.length > 1 ? chosenLessons(m) : (m.lessons || []);
    var lessons = source.filter(function (l) { return l.day || l.start; });
    if (lessons.length === 0) return dayChips((m.weekdays || []).map(day));
    // Dedupe: several day-less block slots produce the same label — one chip suffices.
    var labels = uniq(lessons.map(lessonLabel));
    if (labels.length <= CHIP_LIMIT) return dayChips(labels);
    var days = uniq(lessons.map(function (l) { return l.day ? day(l.day) : s.noFixedDay; }));
    // Alternatives to pick from vs. slots of one class the student attends
    // wholesale — a single class must not be announced as "1 Anlässe".
    var count = groups.length > 1 ? s.classCount(groups.length) : s.slotCount(labels.length);
    return dayChips(days) +
      '<span class="chip day more" title="' + esc(labels.join(", ")) + '">' + esc(count) + "</span>";
  }

  // Modules with published times but no weekday (block courses) can never clash in
  // the timetable — the ideal filler to reach the ECTS target.
  function isFlexible(m) {
    var lessons = m.lessons || [];
    return lessons.length > 0 && lessons.every(function (l) { return !l.day; })
      && (m.weekdays || []).length === 0;
  }

  // Selector between a module's parallel classes (only rendered when selected and
  // there is a real choice); the chosen class is what occupies the timetable.
  function classPicker(m) {
    var s = t();
    var groups = lessonGroups(m);
    // Match the persisted choice by group key — lessonGroups builds fresh arrays on
    // every call, so identity comparison against chosenLessons() would never mark an
    // option selected and the picker would fall back visually to the first class.
    var chosen = groups.map(groupKey).indexOf(chosenClass[m.code]);
    if (chosen < 0) chosen = 0; // no/stale choice -> first class, like chosenLessons()
    var html = '<div><select class="class-pick" data-class="' + esc(m.code) + '" title="' + esc(s.chooseClass) + '">';
    groups.forEach(function (g, i) {
      // The class number is part of the label — it is how the official timetable
      // identifies the Durchführung the student has to enrol in.
      var label = g.map(lessonLabel).join(", ") + (g[0].location ? " · " + g[0].location : "") +
        (g[0].number ? " · " + g[0].number : "");
      html += '<option value="' + esc(groupKey(g, i)) + '"' + (i === chosen ? " selected" : "") + ">" + esc(label) + "</option>";
    });
    return html + "</select></div>";
  }

  // Week grid of the selected modules' chosen classes. Only timed slots can be laid
  // out; modules without published times stay list-only (their soft clash hints and
  // day chips still cover them).
  function timetableHtml(mods) {
    var s = t();
    var slots = selectedSlots(mods).filter(function (x) { return x.s != null && x.e != null && x.e > x.s; });
    if (slots.length === 0) return "";

    slots.forEach(function (a) {
      a.clash = slots.some(function (b) {
        return b !== a && b.m.code !== a.m.code && b.day === a.day && a.s < b.e && b.s < a.e;
      });
    });

    var order = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    var days = order.filter(function (d) { return slots.some(function (x) { return x.day === d; }); });
    var min = Math.floor(Math.min.apply(null, slots.map(function (x) { return x.s; })) / 60) * 60;
    var max = Math.ceil(Math.max.apply(null, slots.map(function (x) { return x.e; })) / 60) * 60;
    var span = Math.max(60, max - min);
    var height = Math.round(Math.max(160, Math.min(340, span * 0.5)));
    var hourPx = height * 60 / span;

    var html = '<div class="timetable"><h2>' + esc(s.timetable) + '</h2><div class="tt">';
    html += '<div class="tt-axis"><div class="tt-head"></div><div class="tt-scale" style="height:' + height + 'px">';
    for (var hm = min; hm <= max; hm += 60) {
      html += '<span style="top:' + (((hm - min) / span) * 100).toFixed(2) + '%">' +
        (hm < 600 ? "0" : "") + (hm / 60) + ":00</span>";
    }
    html += "</div></div>";
    days.forEach(function (dName) {
      // Greedy lane assignment: overlapping blocks share the column side by side
      // instead of hiding each other (first free lane whose last block has ended).
      var colSlots = slots.filter(function (x) { return x.day === dName; })
        .sort(function (a, b) { return a.s - b.s || a.e - b.e; });
      var laneEnds = [];
      colSlots.forEach(function (x) {
        var lane = 0;
        while (lane < laneEnds.length && laneEnds[lane] > x.s) lane++;
        laneEnds[lane] = x.e;
        x.lane = lane;
      });
      var laneW = 100 / laneEnds.length;

      html += '<div class="tt-day"><div class="tt-head">' + esc(day(dName)) + "</div>" +
        '<div class="tt-col" style="height:' + height + 'px;background-image:repeating-linear-gradient(' +
        "to bottom, var(--hairline) 0, var(--hairline) 1px, transparent 1px, transparent " + hourPx.toFixed(2) + 'px)">';
      colSlots.forEach(function (x) {
        // Blocks are labeled with the class number (the id the student sees in the
        // official timetable, e.g. "26HS.W-B-…/VR"); the redundant semester prefix
        // is dropped inside the widget ("oop1/a"). The full id stays in the title,
        // and clicking a block jumps to its module in the list (data-nav).
        var num = (x.l && x.l.number) || x.m.code;
        var shortNum = String(num).replace(/^\d{2}(?:HS|FS)[.-]?/i, "") || num;
        html += '<div class="tt-block' + (x.clash ? " clash" : "") +
          '" data-nav="' + esc(x.m.code) +
          '" style="top:' + (((x.s - min) / span) * 100).toFixed(2) + "%;height:" + (((x.e - x.s) / span) * 100).toFixed(2) +
          "%;left:calc(" + (x.lane * laneW).toFixed(2) + "% + 2px);width:calc(" + laneW.toFixed(2) + "% - 4px)" +
          '" title="' + esc(locTitle(x.m) + " — " + lessonLabel(x.l)) + '">' +
          "<strong>" + esc(shortNum) + "</strong>" +
          '<span class="tt-time">' + esc(x.l.start + "–" + (x.l.end || "")) + "</span></div>";
      });
      html += "</div></div>";
    });
    return html + "</div></div>";
  }

  // Selected block modules can't appear in the timetable grid (no fixed weekday),
  // so they get their own list below it — otherwise a ticked block course is
  // invisible in the schedule overview even though its ECTS count.
  function blockListHtml(mods) {
    var s = t();
    var blocks = mods.filter(isFlexible);
    if (blocks.length === 0) return "";
    var sum = blocks.reduce(function (a, m) { return a + (m.ects || 0); }, 0);
    var html = '<div class="block-list"><h2>' + esc(s.blockList) +
      ' <span class="sum">· ' + sum + " " + esc(s.ects) + "</span></h2><ul>";
    blocks.forEach(function (m) {
      html += "<li><span>" + esc(locTitle(m)) + '</span><span class="code">' + esc(m.code) + "</span>" +
        '<span class="chip ects">' + m.ects + " " + esc(s.ects) + "</span>" +
        scheduleChips(m, true) + "</li>";
    });
    return html + "</ul></div>";
  }

  function detailsPanel(m) {
    if (!expanded[m.code]) return "";
    var s = t();
    var st = details[m.code];
    var body;
    if (!st || st.loading) body = "<p>" + esc(s.loading) + "</p>";
    else if (st.error) body = "<p>" + esc(s.loadError) + (m.url ? " " + linkHtml(m.url, s.official) : "") + "</p>";
    else body = mdHtml(st.text) + (st.url || m.url ? "<p>" + linkHtml(st.url || m.url, s.official) + "</p>" : "");
    return '<div class="details-panel">' + body + "</div>";
  }
  function linkHtml(url, label) {
    return '<a href="' + esc(url) + '" data-open="' + esc(url) + '">' + esc(label) + "</a>";
  }

  // ---------- actions ----------
  // Timetable-block click → the module's row in the list: open the category (or
  // the blocked section) holding it, then scroll to the row and flash it.
  //
  // Opening a collapsed accordion is what used to break this (issue #35).
  // Auto-sizing hosts learn the widget's height from the size report we send at
  // the end of render() and grow the frame one message later, so right after the
  // render the document still overflows its frame: scrollIntoView() then moves
  // the widget's OWN scroller, which the host resets to 0 as soon as the frame
  // grows — dumping the student at the top of the widget instead of on the row.
  // So the target is kept as state and the scroll waits for the frame to catch
  // up; keeping it as state also survives the re-renders that host updates
  // trigger at any time (they would otherwise replace the row mid-scroll).
  var navCode = null;         // module row still to be revealed, null when idle
  var navScrolled = false;    // scroll already done — later renders only re-flash
  var navOwnScroller = false; // capped frame: the widget scrolls itself
  var navHardStop = 0;        // ...but never defer the scroll indefinitely
  var navTimer = null;
  var navSeq = 0;
  // How long a host gets to act on a size report before we accept that it will
  // not resize. Measured per report, not per click: a host update re-rendering
  // the widget mid-navigation sends a NEWER size, and scrolling while that one
  // is still in flight is exactly the race this whole change is about.
  var NAV_FRAME_WAIT_MS = 1200;
  // Renders can keep arriving, so the per-report wait alone could stall forever.
  var NAV_HARD_STOP_MS = 4000;

  // Scrolling is safe as soon as the document fits the frame: the scroll then
  // propagates to the host page instead of moving the widget's own scroller, and
  // a host page's scroll survives the frame being resized underneath it — only
  // the widget's internal scroll gets clamped. Overflow is the dangerous state,
  // and it does NOT mean the host will never grow the frame.
  var askedHeight = 0, askedAt = 0;

  function reportSize() {
    // Record the height the host was actually asked for — frameIsCapped() compares
    // the frame against it, so measuring it differently here would misjudge the
    // host (a shrink leaves documentElement.scrollHeight stuck at the old frame).
    // Host.reportSize() returns that measurement in every host mode, including the
    // ones that size the frame themselves and get no message.
    askedHeight = Host.reportSize();
    askedAt = Date.now();
  }
  // A host that has had the full wait and still keeps the frame smaller than we
  // asked caps the widget in a scrollable frame: no resize is coming, so its own
  // scroller is the one to move. Deliberately the SAME threshold as the wait —
  // a shorter one classifies a slow host's pending resize as "capped" while the
  // wait still considers it in flight, and then scrolls into the resize.
  function frameIsCapped() {
    return askedHeight > 0 && Date.now() - askedAt >= NAV_FRAME_WAIT_MS &&
      window.innerHeight < askedHeight - 2;
  }

  function navigateTo(code) {
    var d = data();
    if (!d) return;
    // Timetable blocks only exist for selected modules, so the plan view has the
    // row — but never navigate to one the current view does not render.
    if (!showAll && !selected[code] && !keepVisible[code]) { showAll = true; viewTouched = true; }
    groupByType(d.eligible || [], t()).forEach(function (c) {
      if (c.entries.some(function (e) { return e.module.code === code; })) catOpen[c.label] = true;
    });
    if (blockedEntries().some(function (e) { return e.module.code === code; })) blockedOpen = true;
    // Classified BEFORE the render, while the reference still describes a frame
    // the host has settled on — the render below asks for a new size and starts
    // that clock over.
    navOwnScroller = frameIsCapped();
    navCode = code;
    navScrolled = false;
    navSeq++;
    navHardStop = Date.now() + NAV_HARD_STOP_MS;
    if (navTimer) { clearTimeout(navTimer); navTimer = null; }
    render(); // ends in revealNav()
  }

  // Flash the pending row and, once the frame geometry has settled, scroll to it.
  // Called after every render and re-armed by its own timer while we wait.
  function revealNav() {
    if (!navCode) return;
    var el = document.querySelector('li[data-mod="' + navCode.replace(/["\\]/g, "\\$&") + '"]');
    if (!el) { endNav(); return; }
    el.classList.add("nav-flash");
    if (navScrolled) return; // already in view — a re-render must not yank the page
    if (navTimer) { clearTimeout(navTimer); navTimer = null; }
    // askedAt is refreshed by every render, so the wait below always tracks the
    // most recent size report rather than the click that started the navigation.
    var now = Date.now();
    var settled = navOwnScroller ||
      document.documentElement.scrollHeight <= window.innerHeight + 2 ||
      now - askedAt >= NAV_FRAME_WAIT_MS ||
      now >= navHardStop;
    if (!settled) { navTimer = setTimeout(revealNav, 40); return; }
    navScrolled = true;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    // Keep the target around for the length of the flash so a re-render during
    // the scroll can restore the cue, then let go of the student's viewport.
    var seq = navSeq;
    setTimeout(function () { if (navSeq === seq) endNav(); }, 2000);
  }

  function endNav() {
    if (navTimer) { clearTimeout(navTimer); navTimer = null; }
    navCode = null;
  }

  function toggle(code) {
    if (selected[code]) { delete selected[code]; keepListed(code); }
    else { selected[code] = true; delete keepVisible[code]; }
    persistState();
    render();
  }

  // One-way uncheck, used by the clash quick-fix buttons.
  function unselect(code) {
    if (!selected[code]) return;
    delete selected[code];
    keepListed(code);
    persistState();
    render();
  }

  // Unticking in the plan view would drop the row out of the list under the
  // student's cursor; keep it there so the click stays undoable in place.
  function keepListed(code) {
    if (!showAll) keepVisible[code] = true;
  }

  function setView(all) {
    if (showAll === all) return;
    showAll = all;
    viewTouched = true;
    keepVisible = {};   // the list is rebuilt anyway — start the plan view clean
    persistState();
    render();
  }

  function toggleDetails(code) {
    if (expanded[code]) { delete expanded[code]; render(); return; }
    expanded[code] = true;
    if (!details[code] && Host.canCall) {
      details[code] = { loading: true };
      Host.callTool("fetch", { id: code }).then(function (res) {
        var sc = extractStructured(res);
        details[code] = sc && sc.text ? { text: sc.text, url: sc.url || null } : { error: true };
        render();
      }).catch(function () {
        details[code] = { error: true };
        render();
      });
    } else if (!details[code]) {
      details[code] = { error: true };
    }
    render();
  }

  function sendPlan() {
    var s = t();
    var mods = selectedModules();
    if (mods.length === 0) return;
    var sum = mods.reduce(function (a, m) { return a + (m.ects || 0); }, 0);
    var lines = mods.map(function (m) {
      var slots = chosenLessons(m).filter(function (l) { return l.day; }).map(lessonLabel).join(", ");
      var open = openPrereqOf(m.code);
      return "- " + m.code + ": " + locTitle(m) + " (" + m.ects + " ECTS" + (slots ? ", " + slots : "") +
        (open ? ", " + s.openPrereq(open) : "") + ")";
    }).join("\n");
    Host.sendMessage(s.followUp(data().semester, lines, sum, target));
  }

  // ---------- events ----------
  document.getElementById("root").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-details],[data-open],[data-nav],[data-unselect],[data-view],#send");
    if (!el) return;
    if (el.hasAttribute("data-details")) { toggleDetails(el.getAttribute("data-details")); }
    else if (el.hasAttribute("data-open")) {
      ev.preventDefault();
      Host.openLink(el.getAttribute("data-open"));
    }
    else if (el.hasAttribute("data-nav")) navigateTo(el.getAttribute("data-nav"));
    else if (el.hasAttribute("data-unselect")) unselect(el.getAttribute("data-unselect"));
    else if (el.hasAttribute("data-view")) setView(el.getAttribute("data-view") === "all");
    else if (el.id === "send") sendPlan();
  });
  // "toggle" does not bubble — listen in the capture phase. Without this, any
  // re-render (hosts fire global updates constantly) rebuilds the <details>
  // element in its default collapsed state right after the user opens it.
  document.getElementById("root").addEventListener("toggle", function (ev) {
    if (!ev.target.matches) return;
    if (ev.target.matches("details.blocked")) blockedOpen = ev.target.open;
    else if (ev.target.matches("details.cat")) catOpen[ev.target.getAttribute("data-cat")] = ev.target.open;
    else return;
    // The native expansion changes the widget's height without going through
    // render(), so the host would never hear about it: an auto-sizing frame
    // stays at its old size and clips the category the student just opened.
    reportSize();
  }, true);
  document.getElementById("root").addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.hasAttribute && el.hasAttribute("data-toggle")) toggle(el.getAttribute("data-toggle"));
    else if (el.hasAttribute && el.hasAttribute("data-class")) {
      chosenClass[el.getAttribute("data-class")] = el.value;
      persistState();
      render();
    }
    else if (el.id === "target") {
      var v = parseInt(el.value, 10);
      if (v > 0) { target = v; targetTouched = true; persistState(); render(); }
    }
  });

  boot();
})();
</script>
</body>
</html>
