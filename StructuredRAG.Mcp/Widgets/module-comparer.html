<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* FHNW design system × modern glass. Keep the token block in sync across
     all four widgets (start, module-comparer, path-planner, semester-planner).
     Palette and type cues come from fhnw.ch: yellow #fde70e (hover #fef16e),
     ink #141414, muted #767676, dark-olive #716800 as the yellow-on-white
     text stand-in, Poppins/Inter type stacks. Glassmorphism adds translucent,
     blurred panels, soft shadows and rounded geometry. Dark mode is its own
     selected set, not an automatic flip. The body stays transparent so the
     host's card background shows through; --surface is only for elements
     that need an opaque fill (inputs, the sticky row-label column). */
  :root {
    color-scheme: light;
    --surface: #ffffff;
    --glass: rgba(255, 255, 255, 0.58);
    --glass-hi: rgba(255, 255, 255, 0.82);
    --glass-border: rgba(20, 20, 20, 0.10);
    --plane: rgba(20, 20, 20, 0.045);
    --ink: #141414;
    --ink-2: #535353;
    --muted: #767676;
    --hairline: rgba(20, 20, 20, 0.12);
    --ring: rgba(20, 20, 20, 0.22);
    --accent: #fde70e;
    --accent-hover: #fef16e;
    --accent-ink: #141414;
    --accent-text: #716800;
    --accent-soft: rgba(253, 231, 14, 0.16);
    --accent-edge: rgba(20, 20, 20, 0.35);
    --check: #141414;
    --warn: #b87e00;
    --good-text: #3d8730;
    --blur: saturate(1.6) blur(14px);
    --shadow: 0 10px 28px rgba(20, 20, 20, 0.10);
    --shadow-soft: 0 6px 18px rgba(20, 20, 20, 0.06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1f1f1f;
    --glass: rgba(30, 30, 30, 0.55);
    --glass-hi: rgba(48, 48, 48, 0.74);
    --glass-border: rgba(255, 255, 255, 0.12);
    --plane: rgba(255, 255, 255, 0.055);
    --ink: #ffffff;
    --ink-2: #c9c9c9;
    --muted: #999999;
    --hairline: rgba(255, 255, 255, 0.13);
    --ring: rgba(255, 255, 255, 0.24);
    --accent: #fde70e;
    --accent-hover: #feec38;
    --accent-ink: #141414;
    --accent-text: #fde70e;
    --accent-soft: rgba(253, 231, 14, 0.14);
    --accent-edge: rgba(253, 231, 14, 0.50);
    --check: #fde70e;
    --warn: #fab219;
    --good-text: #5ccb48;
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Brand glow behind the glass — a hint of FHNW yellow for panels to
     refract; low alpha keeps the host card readable underneath. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(420px 240px at 95% -70px, rgba(253, 231, 14, 0.16), transparent 70%),
      radial-gradient(360px 260px at -90px 110%, rgba(253, 231, 14, 0.08), transparent 70%);
  }
  #root { padding: 16px 18px 14px; }
  h1 {
    position: relative; padding-left: 13px;
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 10px;
  }
  /* Yellow brand bar — echoes the mark in the FHNW logo. */
  h1::before {
    content: ""; position: absolute; left: 0; top: 0.16em; bottom: 0.12em;
    width: 5px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent-hover), var(--accent));
  }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--plane);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 5px 12px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }
  button:hover { background: var(--glass-hi); border-color: var(--ring); transform: translateY(-1px); }
  button:active { transform: none; }
  button:focus-visible, input:focus-visible {
    outline: none;
    border-color: var(--accent-ink);
    box-shadow: 0 0 0 3px rgba(253, 231, 14, 0.45);
  }
  button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* Alert strips: yellow brand bar on the left, like the headings. */
  .notice, .footer .err {
    border-left: 3px solid var(--accent);
    background: var(--plane); border-radius: 0 8px 8px 0;
    padding: 5px 9px;
  }
  .notice { font-size: 12.5px; color: var(--ink-2); margin: 0 0 8px; }

  .table-outer { position: relative; }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--glass-border); border-radius: 14px;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    box-shadow: var(--shadow-soft);
    -webkit-mask-image: var(--mask, none);
    mask-image: var(--mask, none);
  }
  /* Edge fades while columns are hidden (set by updateScrollFade). */
  .table-outer.can-scroll-r .table-wrap {
    --mask: linear-gradient(90deg, #000 calc(100% - 44px), transparent 100%);
  }
  .table-outer.scrolled-l .table-wrap {
    --mask: linear-gradient(90deg, transparent 0, #000 44px);
  }
  .table-outer.can-scroll-r.scrolled-l .table-wrap {
    --mask: linear-gradient(90deg, transparent 0, #000 44px, #000 calc(100% - 44px), transparent 100%);
  }
  .scroll-hint {
    display: none; position: absolute; right: 8px; top: 8px; z-index: 3;
    font-size: 11px; padding: 2px 9px; border-radius: 999px;
    background: var(--glass-hi);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); color: var(--ink-2);
    box-shadow: var(--shadow-soft); pointer-events: none; white-space: nowrap;
  }
  .table-outer.can-scroll-r .scroll-hint { display: block; }
  table { border-collapse: collapse; width: 100%; min-width: 420px; }
  th, td {
    text-align: left; vertical-align: top; padding: 8px 11px;
    border-top: 1px solid var(--hairline); font-weight: 400;
    min-width: 150px; max-width: 260px;
  }
  thead th { border-top: none; background: var(--plane); }
  th.rowlabel, td.rowlabel {
    position: sticky; left: 0; background: var(--surface);
    color: var(--muted); font-size: 12px; white-space: nowrap;
    min-width: 90px; max-width: 130px; border-right: 1px solid var(--hairline);
  }
  /* Sticky corner: needs an opaque base (columns scroll under it) with the
     header's translucent plane tint layered on top to match the other cells. */
  thead th.rowlabel {
    background-color: var(--surface);
    background-image: linear-gradient(var(--plane), var(--plane));
  }
  .col-head { display: flex; align-items: flex-start; gap: 6px; }
  .col-title { font-weight: 600; flex: 1 1 auto; }
  .col-title .code { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
  .col-remove {
    flex: none; border: none; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1;
    background: none;
  }
  .col-remove:hover { color: var(--ink); background: transparent; transform: none; }
  .num { font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    display: inline-block; font-size: 11.5px; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 0 8px; line-height: 17px;
    white-space: nowrap; background: var(--plane);
  }
  .chip.shared {
    border-color: var(--accent-text); color: var(--accent-text);
    background: var(--accent-soft);
  }
  .cell-note { color: var(--muted); font-size: 12px; }
  .summary { font-size: 12.5px; color: var(--ink-2); }
  a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
  .dash { color: var(--muted); }

  .legend { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .footer input {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 9px; padding: 5px 9px; width: 180px;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .footer input:hover { border-color: var(--accent); }
  .footer .err { font-size: 12.5px; color: var(--ink-2); }
  .add-wrap { position: relative; }
  .add-wrap .sugg {
    position: absolute; left: 0; bottom: calc(100% + 4px); z-index: 5; min-width: 260px; max-width: 90vw;
    background: var(--glass-hi);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-radius: 12px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .add-wrap .sugg button {
    display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 0; padding: 7px 10px; font-size: 12.5px;
  }
  .add-wrap .sugg button:hover { background: var(--accent-soft); border: none; transform: none; }
  .add-wrap .sugg .code { color: var(--muted); font-size: 11.5px; flex: none; }
  /* FHNW signature CTA: yellow fill, near-black text. */
  button#add {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 600;
    box-shadow: 0 4px 14px rgba(253, 231, 14, 0.35);
  }
  button#add:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  // ---------- host bridge ----------
  // Abstracts the two widget host conventions over one interface:
  //  - OpenAI Apps SDK (ChatGPT): window.openai globals + methods
  //  - MCP Apps extension (Claude, ...): JSON-RPC 2.0 over postMessage (spec 2026-01-26)
  var Host = (function () {
    var h = {
      mode: "none",       // "openai" | "mcp" | "none"
      ready: false,       // becomes true once host data has arrived (mcp is async)
      theme: null,
      locale: null,
      toolOutput: null,
      widgetState: null,  // openai only; MCP Apps has no widget-state store
      canCall: false,
      onchange: null,
      setState: function () {},
      callTool: function () { return Promise.reject(new Error("no host")); },
      sendMessage: function () {},
      openLink: function (url) { window.open(url, "_blank", "noopener"); },
      reportSize: function () {}
    };
    function notify() { if (h.onchange) h.onchange(); }

    if (window.openai) {
      var api = window.openai;
      h.mode = "openai";
      h.ready = true;
      h.theme = api.theme || null;
      h.locale = api.locale || null;
      h.toolOutput = api.toolOutput || null;
      h.widgetState = api.widgetState || null;
      h.canCall = typeof api.callTool === "function";
      h.setState = function (state, summary) {
        // Widget state persists between renders but is NOT reliably model-visible in
        // ChatGPT. Mirror the model-facing summary into the state snapshot and, where
        // the host supports ui/update-model-context, push it there too — otherwise a
        // profile recorded here never reaches the model unless a flow button is used.
        var snapshot = summary ? Object.assign({}, state, { modelSummary: summary }) : state;
        if (typeof api.setWidgetState === "function") api.setWidgetState(snapshot);
        // Always push — an empty summary must CLEAR previously pushed context
        // (a cleared draft would otherwise stay model-visible), like the MCP branch.
        if (typeof api.updateModelContext === "function") {
          try { api.updateModelContext({ content: summary ? [{ type: "text", text: summary }] : [] }); } catch (e) {}
        }
      };
      h.callTool = function (name, args) { return api.callTool(name, args); };
      h.sendMessage = function (text) { if (typeof api.sendFollowUpMessage === "function") api.sendFollowUpMessage({ prompt: text }); };
      h.openLink = function (url) {
        if (typeof api.openExternal === "function") api.openExternal({ href: url });
        else window.open(url, "_blank", "noopener");
      };
      // ChatGPT fires set_globals for many reasons (scroll, keyboard, layout
      // changes — very frequently on mobile). Re-rendering on every event snaps
      // open dropdowns shut mid-pick, so only notify when something the widget
      // actually renders from has changed.
      var sigOf = function () {
        var ws; try { ws = JSON.stringify(h.widgetState || null); } catch (e) { ws = ""; }
        return [h.theme, h.locale, ws].join("|");
      };
      var lastSig = sigOf();
      window.addEventListener("openai:set_globals", function () {
        var toolChanged = !!api.toolOutput && api.toolOutput !== h.toolOutput;
        h.theme = api.theme || h.theme;
        h.locale = api.locale || h.locale;
        h.toolOutput = api.toolOutput || h.toolOutput;
        h.widgetState = api.widgetState || h.widgetState;
        var sig = sigOf();
        if (!toolChanged && sig === lastSig) return;
        lastSig = sig;
        notify();
      });
    } else if (window.parent && window.parent !== window) {
      h.mode = "mcp";
      h.canCall = true;
      var nextId = 1, pending = {};
      var post = function (msg) { window.parent.postMessage(msg, "*"); };
      var request = function (method, params) {
        return new Promise(function (resolve, reject) {
          var id = nextId++;
          pending[id] = { resolve: resolve, reject: reject };
          post({ jsonrpc: "2.0", id: id, method: method, params: params });
        });
      };
      window.addEventListener("message", function (ev) {
        var m = ev.data;
        if (!m || m.jsonrpc !== "2.0") return;
        if (m.id !== undefined && m.method === undefined) {
          var p = pending[m.id];
          if (!p) return;
          delete pending[m.id];
          if (m.error) p.reject(new Error(m.error.message || "host error")); else p.resolve(m.result);
          return;
        }
        if (m.method === "ui/notifications/tool-result") {
          var pr = m.params || {};
          if (pr.structuredContent) { h.toolOutput = pr.structuredContent; h.ready = true; notify(); }
        } else if (m.method === "ui/notifications/host-context-changed") {
          var c = m.params || {};
          if (c.theme) h.theme = c.theme;
          if (c.locale) h.locale = c.locale;
          notify();
        }
      });
      h.setState = function (state, summary) {
        // Nearest MCP Apps equivalent of widget state: persist into the model
        // context (each request overwrites the previous one).
        request("ui/update-model-context", {
          structuredContent: state,
          content: summary ? [{ type: "text", text: summary }] : []
        }).catch(function () {});
      };
      h.callTool = function (name, args) { return request("tools/call", { name: name, arguments: args }); };
      h.sendMessage = function (text) {
        // MCP Apps expects content as a ContentBlock ARRAY — validating hosts
        // reject a bare object, and the send-to-chat buttons silently do nothing.
        request("ui/message", { role: "user", content: [{ type: "text", text: text }] }).catch(function () {});
      };
      h.openLink = function (url) { request("ui/open-link", { url: url }).catch(function () {}); };
      h.reportSize = function () {
        // Height comes from the content root, not documentElement.scrollHeight:
        // the latter is floored at the viewport, so once the host has grown the
        // frame the widget could never ask for a SMALLER one again — collapsing
        // a section would leave an oversized, mostly blank card in the chat.
        var root = document.getElementById("root");
        post({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
               params: { width: document.documentElement.scrollWidth,
                         height: root ? Math.ceil(root.getBoundingClientRect().height)
                                      : document.documentElement.scrollHeight } });
      };
      request("ui/initialize", {
        protocolVersion: "2026-01-26",
        clientInfo: { name: "module-catalog-widget", version: "1.0.0" },
        capabilities: {},
        appCapabilities: {}
      }).then(function (res) {
        var ctx = (res && res.hostContext) || {};
        if (ctx.theme) h.theme = ctx.theme;
        if (ctx.locale) h.locale = ctx.locale;
        notify();
      }).catch(function () { notify(); });
    }
    return h;
  })();

  // ---------- i18n ----------
  function isDe() {
    var loc = Host.locale || "de";
    return String(loc).toLowerCase().indexOf("de") === 0;
  }
  var STR = {
    de: {
      title: "Modulvergleich",
      ects: "ECTS",
      level: "Stufe",
      type: "Typ",
      semesters: "Semester",
      languages: "Sprachen",
      weekdays: "Lektionen",
      noFixedDay: "unregelm.",
      tags: "Tags",
      prereqs: "Voraussetzungen",
      orSep: " oder ",
      recommended: "Empfohlen",
      prereqNotes: "Hinweise",
      summary: "Kurzbeschreibung",
      link: "Modulseite",
      official: "öffnen ↗",
      none: "keine",
      sharedLegend: "◆ = Tag bei allen verglichenen Modulen",
      notFound: function (codes) { return "⚠ Nicht im Katalog gefunden: " + codes; },
      addPlaceholder: "Modulcode hinzufügen…",
      add: "Vergleichen",
      scrollHint: "Weitere Spalten →",
      swapFailed: "Vergleich konnte nicht aktualisiert werden — Tabelle unverändert.",
      removeTitle: "Aus dem Vergleich entfernen",
      noData: "Keine Vergleichsdaten — bitte zuerst compare_modules aufrufen.",
      maxCols: "Maximal 4 Module vergleichbar — zuerst eines entfernen."
    },
    en: {
      title: "Module comparison",
      ects: "ECTS",
      level: "Level",
      type: "Type",
      semesters: "Semesters",
      languages: "Languages",
      weekdays: "Lessons",
      noFixedDay: "irreg.",
      tags: "Tags",
      prereqs: "Prerequisites",
      orSep: " or ",
      recommended: "Recommended",
      prereqNotes: "Notes",
      summary: "Summary",
      link: "Module page",
      official: "open ↗",
      none: "none",
      sharedLegend: "◆ = tag shared by all compared modules",
      notFound: function (codes) { return "⚠ Not found in the catalog: " + codes; },
      addPlaceholder: "Add module code…",
      add: "Compare",
      scrollHint: "More columns →",
      swapFailed: "Could not update the comparison — table unchanged.",
      removeTitle: "Remove from comparison",
      noData: "No comparison data — call compare_modules first.",
      maxCols: "At most 4 modules can be compared — remove one first."
    }
  };
  function t() { return isDe() ? STR.de : STR.en; }
  var DAYS = {
    de: { Monday: "Mo", Tuesday: "Di", Wednesday: "Mi", Thursday: "Do", Friday: "Fr", Saturday: "Sa", Sunday: "So" },
    en: { Monday: "Mon", Tuesday: "Tue", Wednesday: "Wed", Thursday: "Thu", Friday: "Fri", Saturday: "Sat", Sunday: "Sun" }
  };
  function day(d) { return (isDe() ? DAYS.de : DAYS.en)[d] || d; }

  // ---------- state ----------
  var current = null;      // {modules:[], notFound:[]} — starts as toolOutput, updated via callTool
  var busy = false;
  var errorMsg = null;
  var initialized = false;
  var addQuery = "";       // live text of the add-module input (drives the typeahead)
  var addSugg = [];        // typeahead suggestions: [{id, title}]
  var addSeq = 0;          // search-request counter — stale responses are dropped

  function init() {
    if (initialized) return;
    var d = Host.toolOutput;
    if (!d || !Array.isArray(d.modules)) return;
    current = d;
    initialized = true;
    // Restore a column set changed in an earlier turn, if it differs from this call's output.
    var ws = Host.widgetState;
    var saved = ws && Array.isArray(ws.codes) ? ws.codes : null;
    if (saved && saved.length >= 2 && saved.join("|") !== codes().join("|")) refresh(saved);
  }

  function codes() {
    return current ? current.modules.map(function (m) { return m.code; }) : [];
  }

  function persistState() {
    Host.setState({ codes: codes() }, "Modules currently compared in the widget: " + codes().join(", "));
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function locTitle(m) { return (!isDe() && m.titleEn) ? m.titleEn : m.title; }
  function locSummary(m) { return (!isDe() && m.summaryEn) ? m.summaryEn : m.summary; }
  function semesters(m) {
    if ((m.offerings || []).length > 0) return m.offerings.map(function (o) { return o.semesterId; });
    return m.offeredIn || [];
  }
  // callTool result → structured payload: prefer structuredContent, fall back to
  // parsing the JSON text block hosts emit when structured output is unavailable.
  function extractStructured(res) {
    if (!res) return null;
    var sc = res.structuredContent || (res.result && res.result.structuredContent);
    if (sc) return sc;
    var content = res.content || (res.result && res.result.content);
    if (Array.isArray(content)) {
      var text = content.map(function (c) { return c && c.text ? c.text : ""; }).join("\n");
      if (text) {
        try { return JSON.parse(text); } catch (e) { return null; }
      }
    }
    return null;
  }
  function sharedTags(mods) {
    if (mods.length < 2) return {};
    var counts = {};
    mods.forEach(function (m) {
      var seen = {};
      (m.tags || []).forEach(function (tag) {
        var k = tag.toLowerCase();
        if (!seen[k]) { seen[k] = true; counts[k] = (counts[k] || 0) + 1; }
      });
    });
    var shared = {};
    Object.keys(counts).forEach(function (k) { if (counts[k] === mods.length) shared[k] = true; });
    return shared;
  }

  // ---------- rendering ----------
  function render() {
    hostRenderDeferred = false; // any render satisfies a pending host update
    init();
    var root = document.getElementById("root");
    var s = t();
    if (!current) {
      // In MCP Apps the tool result arrives asynchronously after ui/initialize —
      // don't flash the "no data" message while waiting.
      root.innerHTML = '<div class="empty">' + esc(Host.mode === "mcp" && !Host.ready ? "…" : s.noData) + "</div>";
      Host.reportSize();
      return;
    }
    var mods = current.modules;
    var shared = sharedTags(mods);
    var anyShared = Object.keys(shared).length > 0;

    var html = "<h1>" + esc(s.title) + "</h1>";
    if ((current.notFound || []).length > 0)
      html += '<div class="notice" role="status">' + esc(s.notFound(current.notFound.join(", "))) + "</div>";

    html += '<div class="table-outer"><div class="table-wrap"><table>';

    // Header row: module titles + remove buttons
    html += '<thead><tr><th class="rowlabel"></th>';
    mods.forEach(function (m) {
      html += '<th><div class="col-head"><span class="col-title">' + esc(locTitle(m)) +
        '<span class="code">' + esc(m.code) + "</span></span>" +
        (mods.length > 2
          ? '<button class="col-remove" data-remove="' + esc(m.code) + '" title="' + esc(s.removeTitle) + '">×</button>'
          : "") +
        "</div></th>";
    });
    html += "</tr></thead><tbody>";

    html += row(s.ects, mods, function (m) { return '<span class="num">' + m.ects + "</span>"; });
    html += row(s.level, mods, function (m) { return esc(m.level); });
    html += row(s.type, mods, function (m) { return esc(m.moduleType); });
    html += row(s.semesters, mods, function (m) { return esc(semesters(m).join(", ")); });
    html += row(s.languages, mods, function (m) { return esc((m.languages || []).join(", ")); });
    // Lesson-slot chips (one per weekly slot, incl. times) when published;
    // otherwise the plain weekday names.
    html += row(s.weekdays, mods, function (m) {
      var lessons = (m.lessons || []).filter(function (l) { return l.day || l.start; });
      if (lessons.length === 0) {
        return chips((m.weekdays || []).map(function (w) { return { label: day(w) }; }));
      }
      return chips(lessons.map(function (l) {
        // Block courses publish times without a weekday — say so instead of a cryptic "?".
        var label = (l.day ? day(l.day) : s.noFixedDay) + (l.start ? " " + l.start + "–" + (l.end || "?") : "");
        if (l.location) label += " · " + l.location;
        return { label: label };
      }));
    });
    html += row(s.tags, mods, function (m) {
      return chips((m.tags || []).map(function (tag) {
        var hit = shared[tag.toLowerCase()];
        return { label: (hit ? "◆ " : "") + tag, cls: hit ? "shared" : "" };
      }));
    });
    html += row(s.prereqs, mods, function (m) {
      // One chip per group; interchangeable variants share a chip ("A oder B").
      var groups = m.prerequisiteGroups || (m.prerequisites || []).map(function (c) { return [c]; });
      return groups.length ? chips(groups.map(function (g) { return { label: g.join(s.orSep) }; })) : '<span class="cell-note">' + esc(s.none) + "</span>";
    });
    html += row(s.recommended, mods, function (m) {
      var codes = m.recommended || [];
      return codes.length ? chips(codes.map(function (c) { return { label: c }; })) : "";
    });
    html += row(s.prereqNotes, mods, function (m) {
      return m.prerequisiteNotes ? '<span class="cell-note">' + esc(m.prerequisiteNotes) + "</span>" : "";
    });
    html += row(s.summary, mods, function (m) { return '<span class="summary">' + esc(locSummary(m)) + "</span>"; });
    html += row(s.link, mods, function (m) {
      return m.url ? '<a href="' + esc(m.url) + '" data-open="' + esc(m.url) + '">' + esc(s.official) + "</a>" : "";
    });

    html += "</tbody></table></div>" +
      '<div class="scroll-hint" aria-hidden="true">' + esc(s.scrollHint) + "</div></div>";

    if (anyShared) html += '<div class="legend">' + esc(s.sharedLegend) + "</div>";

    html += '<div class="footer">' +
      '<div class="add-wrap">' +
      '<input id="add-code" placeholder="' + esc(s.addPlaceholder) + '" value="' + esc(addQuery) + '"' +
      (busy ? " disabled" : "") + ' autocomplete="off">' +
      suggHtml() +
      "</div>" +
      '<button id="add"' + (busy ? " disabled" : "") + ">" + esc(s.add) + "</button>" +
      (errorMsg ? '<span class="err" role="alert">' + esc(errorMsg) + "</span>" : "") +
      "</div>";

    root.innerHTML = html;
    // Keep typing fluid: restore focus/caret after innerHTML rebuild.
    var ai = document.getElementById("add-code");
    if (addQuery && ai) { ai.focus(); ai.setSelectionRange(addQuery.length, addQuery.length); }
    updateScrollFade();
    Host.reportSize();
  }

  function suggHtml() {
    if (addSugg.length === 0) return "";
    return '<div class="sugg">' + addSugg.map(function (r) {
      return '<button data-addcode="' + esc(r.id) + '"><span class="code">' + esc(r.id) + "</span>" +
        esc(r.title) + "</button>";
    }).join("") + "</div>";
  }

  // Scroll affordance: mask-fades the table edge(s) that hide columns and
  // shows the "more columns" pill while scrolling right is possible.
  function updateScrollFade() {
    var wrap = document.querySelector(".table-wrap");
    var outer = document.querySelector(".table-outer");
    if (!wrap || !outer) return;
    var upd = function () {
      outer.classList.toggle("can-scroll-r",
        wrap.scrollWidth > wrap.clientWidth + 4 && wrap.scrollLeft + wrap.clientWidth < wrap.scrollWidth - 4);
      outer.classList.toggle("scrolled-l", wrap.scrollLeft > 4);
    };
    wrap.addEventListener("scroll", upd);
    upd();
  }

  // A row is skipped entirely when no column has a value (sample catalogs
  // lack e.g. weekdays and module types).
  function row(label, mods, cell) {
    var cells = mods.map(cell);
    if (cells.every(function (c) { return !c; })) return "";
    return '<tr><td class="rowlabel">' + esc(label) + "</td>" +
      cells.map(function (c) { return "<td>" + (c || '<span class="dash">–</span>') + "</td>"; }).join("") +
      "</tr>";
  }
  function chips(items) {
    if (!items.length) return "";
    return '<div class="chips">' + items.map(function (it) {
      return '<span class="chip ' + (it.cls || "") + '">' + esc(it.label) + "</span>";
    }).join("") + "</div>";
  }

  // ---------- actions ----------
  function refresh(newCodes) {
    if (!Host.canCall) { errorMsg = t().swapFailed; render(); return; }
    busy = true;
    errorMsg = null;
    render();
    Host.callTool("compare_modules", { codes: newCodes }).then(function (res) {
      var sc = extractStructured(res);
      busy = false;
      if (sc && Array.isArray(sc.modules) && sc.modules.length >= 2) {
        current = sc;
        persistState();
      } else {
        errorMsg = t().swapFailed;
      }
      render();
    }).catch(function () {
      busy = false;
      errorMsg = t().swapFailed;
      render();
    });
  }

  function addCode(code) {
    if (!code || busy) return;
    // The input is being cleared — cancel a pending debounce and drop any
    // in-flight typeahead response, or stale suggestions would reappear
    // over the empty (or busy) input after the module was added.
    if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
    addSeq++;
    if (codes().length >= 4) { errorMsg = t().maxCols; render(); return; }
    if (codes().some(function (c) { return c.toLowerCase() === code.toLowerCase(); })) {
      addQuery = ""; addSugg = []; render(); return;
    }
    addQuery = ""; addSugg = [];
    refresh(codes().concat([code]));
  }

  function addModule() {
    var input = document.getElementById("add-code");
    addCode((input && input.value || "").trim());
  }

  // Typeahead: debounced free-text search; stale responses are dropped so a
  // slow earlier request never overwrites suggestions for the current query.
  var searchTimer = null;
  function onAddInput(value) {
    addQuery = value;
    errorMsg = null;
    var q = value.trim();
    if (searchTimer) clearTimeout(searchTimer);
    if (!Host.canCall || q.length < 2) {
      // Invalidate any in-flight search for the previous query — its late
      // response must not repopulate the dropdown for a cleared/short input.
      addSeq++;
      if (addSugg.length > 0) { addSugg = []; render(); }
      return;
    }
    var seq = ++addSeq;
    searchTimer = setTimeout(function () {
      Host.callTool("search", { query: q }).then(function (res) {
        if (seq !== addSeq) return;
        var sc = extractStructured(res);
        var have = {};
        codes().forEach(function (c) { have[c.toLowerCase()] = true; });
        addSugg = ((sc && sc.results) || [])
          .filter(function (r) { return r && r.id && !have[String(r.id).toLowerCase()]; })
          .slice(0, 6);
        render();
      }).catch(function () {});
    }, 250);
  }

  function removeModule(code) {
    if (!current || current.modules.length <= 2) return;
    // The data for the remaining columns is already local — no server call needed.
    current = {
      modules: current.modules.filter(function (m) { return m.code !== code; }),
      notFound: current.notFound || []
    };
    errorMsg = null;
    persistState();
    render();
  }

  // ---------- events ----------
  document.getElementById("root").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-remove],[data-open],[data-addcode],#add");
    if (!el) return;
    if (el.hasAttribute("data-remove")) removeModule(el.getAttribute("data-remove"));
    else if (el.hasAttribute("data-open")) {
      ev.preventDefault();
      Host.openLink(el.getAttribute("data-open"));
    }
    else if (el.hasAttribute("data-addcode")) addCode(el.getAttribute("data-addcode"));
    else if (el.id === "add") addModule();
  });
  document.getElementById("root").addEventListener("keydown", function (ev) {
    if (ev.target.id === "add-code" && ev.key === "Enter") addModule();
  });
  document.getElementById("root").addEventListener("input", function (ev) {
    if (ev.target.id === "add-code") onAddInput(ev.target.value);
  });

  function applyTheme() {
    var theme = Host.theme ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  }

  // Host-triggered re-renders must never destroy a form control the student is
  // using: replacing an open <select> closes it before a choice can be made.
  // Defer the render until the control is committed or left; our own event
  // handlers keep calling render() directly (the dropdown is closed by then).
  var hostRenderDeferred = false;
  function hostRender() {
    var root = document.getElementById("root");
    var active = document.activeElement;
    if (active && root.contains(active) && (active.tagName === "SELECT" || active.tagName === "INPUT")) {
      if (hostRenderDeferred) return;
      hostRenderDeferred = true;
      var done = function (ev) {
        active.removeEventListener("blur", done);
        active.removeEventListener("change", done);
        hostRenderDeferred = false;
        // Focus moving to another element inside the widget (e.g. clicking an
        // autocomplete suggestion or a button): rendering right now would replace
        // the click target mid-gesture — let the click land first, then refresh.
        if (ev && ev.type === "blur" && ev.relatedTarget && root.contains(ev.relatedTarget)) {
          setTimeout(hostRender, 150);
          return;
        }
        render();
      };
      active.addEventListener("blur", done);
      active.addEventListener("change", done);
      return;
    }
    render();
  }

  Host.onchange = function () { applyTheme(); hostRender(); };

  applyTheme();
  render();
})();
</script>
</body>
</html>
