<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* FHNW design system × modern glass. Keep the token block in sync across
     all four widgets (start, module-comparer, path-planner, semester-planner).
     Palette and type cues come from fhnw.ch: yellow #fde70e (hover #fef16e),
     ink #141414, muted #767676, dark-olive #716800 as the yellow-on-white
     text stand-in, Poppins/Inter type stacks. Glassmorphism adds translucent,
     blurred panels, soft shadows and rounded geometry. Dark mode is its own
     selected set, not an automatic flip. The body stays transparent so the
     host's card background shows through; --surface is only for elements
     that need an opaque fill (inputs, sticky columns). */
  :root {
    color-scheme: light;
    --surface: #ffffff;
    --glass: rgba(255, 255, 255, 0.58);
    --glass-hi: rgba(255, 255, 255, 0.82);
    --glass-border: rgba(20, 20, 20, 0.10);
    --plane: rgba(20, 20, 20, 0.045);
    --ink: #141414;
    --ink-2: #535353;
    --muted: #767676;
    --hairline: rgba(20, 20, 20, 0.12);
    --ring: rgba(20, 20, 20, 0.22);
    --accent: #fde70e;
    --accent-hover: #fef16e;
    --accent-ink: #141414;
    --accent-text: #716800;
    --accent-soft: rgba(253, 231, 14, 0.16);
    --accent-edge: rgba(20, 20, 20, 0.35);
    --check: #141414;
    --warn: #b87e00;
    --good-text: #3d8730;
    --blur: saturate(1.6) blur(14px);
    --shadow: 0 10px 28px rgba(20, 20, 20, 0.10);
    --shadow-soft: 0 6px 18px rgba(20, 20, 20, 0.06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1f1f1f;
    --glass: rgba(30, 30, 30, 0.55);
    --glass-hi: rgba(48, 48, 48, 0.74);
    --glass-border: rgba(255, 255, 255, 0.12);
    --plane: rgba(255, 255, 255, 0.055);
    --ink: #ffffff;
    --ink-2: #c9c9c9;
    --muted: #999999;
    --hairline: rgba(255, 255, 255, 0.13);
    --ring: rgba(255, 255, 255, 0.24);
    --accent: #fde70e;
    --accent-hover: #feec38;
    --accent-ink: #141414;
    --accent-text: #fde70e;
    --accent-soft: rgba(253, 231, 14, 0.14);
    --accent-edge: rgba(253, 231, 14, 0.50);
    --check: #fde70e;
    --warn: #fab219;
    --good-text: #5ccb48;
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Brand glow behind the glass — a hint of FHNW yellow for panels to
     refract; low alpha keeps the host card readable underneath. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(420px 240px at 95% -70px, rgba(253, 231, 14, 0.16), transparent 70%),
      radial-gradient(360px 260px at -90px 110%, rgba(253, 231, 14, 0.08), transparent 70%);
  }
  #root { padding: 16px 18px; }
  h1, h2 {
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: -0.01em;
  }
  /* Yellow brand bar — echoes the mark in the FHNW logo. */
  h1, h2 { position: relative; padding-left: 13px; }
  h1::before, h2::before {
    content: ""; position: absolute; left: 0; top: 0.16em; bottom: 0.12em;
    width: 5px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent-hover), var(--accent));
  }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--plane);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 5px 12px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }
  button:hover { background: var(--glass-hi); border-color: var(--ring); transform: translateY(-1px); }
  button:active { transform: none; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: none;
    border-color: var(--accent-ink);
    box-shadow: 0 0 0 3px rgba(253, 231, 14, 0.45);
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .header h1 { font-size: 15.5px; font-weight: 600; margin: 0; }
  .header .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .info-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0 2px; }
  .chip {
    display: inline-block; font-size: 11.5px; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 0 8px; line-height: 18px;
    white-space: nowrap; background: var(--plane);
  }
  .chip.ects {
    font-variant-numeric: tabular-nums; font-weight: 600;
    background: #141414; color: #fde70e; border-color: transparent;
  }

  .section { border-top: 1px solid var(--hairline); margin-top: 14px; padding-top: 12px; }
  .section h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .section .desc { font-size: 12px; color: var(--muted); margin: -1px 0 7px; }

  .picker { position: relative; }
  .picker input {
    width: 100%; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 9px; padding: 6px 10px;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .picker input:hover { border-color: var(--accent); }
  .suggestions {
    position: absolute; left: 0; right: 0; top: 100%; z-index: 5;
    background: var(--glass-hi);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-border); border-radius: 12px;
    margin-top: 4px; overflow: hidden; box-shadow: var(--shadow);
  }
  .suggestions button {
    display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left;
    background: transparent; border: none; border-radius: 0; padding: 7px 10px; font-size: 12.5px;
  }
  .suggestions button:hover { background: var(--accent-soft); border: none; transform: none; }
  .suggestions button .code { color: var(--muted); font-size: 11.5px; flex: none; }
  .suggestions button .ects {
    color: var(--muted); font-size: 11.5px; margin-left: auto; flex: none;
    font-variant-numeric: tabular-nums;
  }
  .sel-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
  .sel-chips .chip { display: inline-flex; align-items: center; gap: 4px; }
  .sel-chips .chip .chip-code { color: var(--muted); font-size: 10.5px; letter-spacing: 0.03em; }
  .sel-chips .chip .chip-ects { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .sel-chips .chip button {
    border: none; padding: 0 2px; font-size: 12px; color: var(--muted); background: none; line-height: 1;
  }
  .sel-chips .chip button:hover { color: var(--ink); background: none; transform: none; }
  .clear-all {
    border: none; background: none; color: var(--muted); font-size: 12px; padding: 0 4px;
    text-decoration: underline; text-underline-offset: 2px;
  }
  .clear-all:hover { color: var(--ink); background: none; transform: none; }
  .none-note { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .target-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
  .target-row label { font-size: 12.5px; color: var(--ink-2); }
  .target-row input {
    width: 62px; font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 4px 7px;
    font-variant-numeric: tabular-nums;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .target-row input:hover { border-color: var(--accent); }

  .flows { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 6px; }
  @media (min-width: 480px) { .flows { grid-template-columns: 1fr 1fr 1fr; } }
  .flow {
    position: relative; overflow: hidden;
    text-align: left; padding: 11px 13px; border-radius: 14px;
    border: 1px solid var(--glass-border); display: block;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
  }
  .flow::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: linear-gradient(180deg, var(--accent-hover), var(--accent));
    opacity: 0; transition: opacity 0.15s ease;
  }
  .flow:hover {
    border-color: var(--accent); background: var(--glass-hi);
    transform: translateY(-2px); box-shadow: var(--shadow);
  }
  .flow:hover::before { opacity: 1; }
  .flow .flow-title { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .flow .flow-ico { color: var(--accent-text); flex: none; display: inline-flex; }
  .flow .flow-desc { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  // ---------- host bridge ----------
  // Abstracts the two widget host conventions over one interface:
  //  - OpenAI Apps SDK (ChatGPT): window.openai globals + methods
  //  - MCP Apps extension (Claude, ...): JSON-RPC 2.0 over postMessage (spec 2026-01-26)
  var Host = (function () {
    var h = {
      mode: "none",
      ready: false,
      theme: null,
      locale: null,
      toolOutput: null,
      widgetState: null,
      onchange: null,
      setState: function () {},
      sendMessage: function () {},
      reportSize: function () {}
    };
    function notify() { if (h.onchange) h.onchange(); }

    if (window.openai) {
      var api = window.openai;
      h.mode = "openai";
      h.ready = true;
      h.theme = api.theme || null;
      h.locale = api.locale || null;
      h.toolOutput = api.toolOutput || null;
      h.widgetState = api.widgetState || null;
      h.setState = function (state, summary) {
        // Widget state persists between renders but is NOT reliably model-visible in
        // ChatGPT. Mirror the model-facing summary into the state snapshot and, where
        // the host supports ui/update-model-context, push it there too — otherwise a
        // profile recorded here never reaches the model unless a flow button is used.
        var snapshot = summary ? Object.assign({}, state, { modelSummary: summary }) : state;
        if (typeof api.setWidgetState === "function") api.setWidgetState(snapshot);
        // Always push — an empty summary must CLEAR previously pushed context
        // (a cleared draft would otherwise stay model-visible), like the MCP branch.
        if (typeof api.updateModelContext === "function") {
          try { api.updateModelContext({ content: summary ? [{ type: "text", text: summary }] : [] }); } catch (e) {}
        }
      };
      h.sendMessage = function (text) { if (typeof api.sendFollowUpMessage === "function") api.sendFollowUpMessage({ prompt: text }); };
      // ChatGPT fires set_globals for many reasons (scroll, keyboard, layout
      // changes — very frequently on mobile). Re-rendering on every event snaps
      // open dropdowns shut mid-pick, so only notify when something the widget
      // actually renders from has changed.
      var sigOf = function () {
        var ws; try { ws = JSON.stringify(h.widgetState || null); } catch (e) { ws = ""; }
        return [h.theme, h.locale, ws].join("|");
      };
      var lastSig = sigOf();
      window.addEventListener("openai:set_globals", function () {
        var toolChanged = !!api.toolOutput && api.toolOutput !== h.toolOutput;
        h.theme = api.theme || h.theme;
        h.locale = api.locale || h.locale;
        h.toolOutput = api.toolOutput || h.toolOutput;
        h.widgetState = api.widgetState || h.widgetState;
        var sig = sigOf();
        if (!toolChanged && sig === lastSig) return;
        lastSig = sig;
        notify();
      });
    } else if (window.parent && window.parent !== window) {
      h.mode = "mcp";
      var nextId = 1, pending = {};
      var post = function (msg) { window.parent.postMessage(msg, "*"); };
      var request = function (method, params) {
        return new Promise(function (resolve, reject) {
          var id = nextId++;
          pending[id] = { resolve: resolve, reject: reject };
          post({ jsonrpc: "2.0", id: id, method: method, params: params });
        });
      };
      window.addEventListener("message", function (ev) {
        var m = ev.data;
        if (!m || m.jsonrpc !== "2.0") return;
        if (m.id !== undefined && m.method === undefined) {
          var p = pending[m.id];
          if (!p) return;
          delete pending[m.id];
          if (m.error) p.reject(new Error(m.error.message || "host error")); else p.resolve(m.result);
          return;
        }
        if (m.method === "ui/notifications/tool-result") {
          var pr = m.params || {};
          if (pr.structuredContent) { h.toolOutput = pr.structuredContent; h.ready = true; notify(); }
        } else if (m.method === "ui/notifications/host-context-changed") {
          var c = m.params || {};
          if (c.theme) h.theme = c.theme;
          if (c.locale) h.locale = c.locale;
          notify();
        }
      });
      h.setState = function (state, summary) {
        request("ui/update-model-context", {
          structuredContent: state,
          content: summary ? [{ type: "text", text: summary }] : []
        }).catch(function () {});
      };
      h.sendMessage = function (text) {
        // MCP Apps expects content as a ContentBlock ARRAY — validating hosts
        // reject a bare object, and the send-to-chat buttons silently do nothing.
        request("ui/message", { role: "user", content: [{ type: "text", text: text }] }).catch(function () {});
      };
      h.reportSize = function () {
        // Height comes from the content root's scrollHeight, and returns what was
        // sent so callers can track it. documentElement.scrollHeight is floored at
        // the viewport — a widget measuring that way could never ask for a SMALLER
        // frame, so collapsing a section would leave a blank card in the chat —
        // while the root's bounding box would miss absolutely positioned overflow
        // such as the autocomplete list. scrollHeight covers both.
        var root = document.getElementById("root");
        var height = root ? root.scrollHeight : document.documentElement.scrollHeight;
        post({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
               params: { width: document.documentElement.scrollWidth, height: height } });
        return height;
      };
      request("ui/initialize", {
        protocolVersion: "2026-01-26",
        clientInfo: { name: "module-catalog-widget", version: "1.0.0" },
        capabilities: {},
        appCapabilities: {}
      }).then(function (res) {
        var ctx = (res && res.hostContext) || {};
        if (ctx.theme) h.theme = ctx.theme;
        if (ctx.locale) h.locale = ctx.locale;
        notify();
      }).catch(function () { notify(); });
    }
    return h;
  })();

  // ---------- i18n ----------
  function isDe() {
    var loc = Host.locale || "de";
    return String(loc).toLowerCase().indexOf("de") === 0;
  }
  var STR = {
    de: {
      title: "Modul-Berater",
      catalogInfo: function (d) { return d.moduleCount + " Module · " + d.tagCount + " Themen · Katalog vom " + d.compiledAt; },
      completedTitle: "Bereits abgeschlossene Module",
      completedDesc: "Einmal erfassen — sie fliessen in jede Planung ein.",
      searchPlaceholder: "Modul suchen (Code oder Titel)…",
      noneYet: "Noch keine erfasst — auch ok, dann plane ich ab Studienbeginn.",
      removeTitle: "Entfernen",
      clearAll: "Alle entfernen",
      ectsLabel: "ECTS-Ziel pro Semester",
      flowsTitle: "Was möchtest du tun?",
      flowPlan: "Nächstes Semester planen",
      flowPlanDesc: "Konkreter Vorschlag passend zu deinen Interessen",
      flowPath: "Zielmodul erreichen",
      flowPathDesc: "Schnellster Weg zu einem Wunschmodul",
      flowExplore: "Katalog entdecken",
      flowExploreDesc: "Themen und passende Module kennenlernen",
      msgCompleted: function (codes) { return codes.length ? "Bereits abgeschlossen: " + codes.join(", ") + "." : "Ich habe noch keine Module abgeschlossen."; },
      msgPlan: function (ects, completed) {
        return "Plane mein nächstes Semester mit Ziel " + ects + " ECTS. " + completed +
          " Berücksichtige meine Interessen, falls du sie aus diesem Chat kennst — sonst frag mich nicht aus, " +
          "sondern schlage direkt einen ausgewogenen Plan vor (Pflicht- und Grundlagenmodule zuerst) und nenne " +
          "kurz deine Annahmen. Stelle aus dem Katalogüberblick einen konkreten, überschneidungsfreien Plan " +
          "zusammen und übergib ihn als proposedModules an plan_semester.";
      },
      msgPath: function (completed) {
        return "Ich möchte auf ein Zielmodul hinarbeiten. " + completed +
          " Hilf mir zuerst, das passende Zielmodul zu finden (frag nach meinen Interessen), " +
          "und zeige mir dann mit plan_path den schnellsten Weg dorthin.";
      },
      msgExplore: function (completed) {
        return "Gib mir einen Überblick über den Modulkatalog: Welche Themenbereiche gibt es, " +
          "und welche Module könnten zu mir passen? " + completed +
          " Stelle mir gerne 2-3 Fragen zu meinen Interessen.";
      },
      profileSummary: function (codes, ects) {
        return "Student profile from the start widget — completed modules: " +
          (codes.length ? codes.join(", ") : "none") + "; ECTS target: " + ects + ".";
      },
      noData: "Keine Daten — bitte zuerst get_started aufrufen."
    },
    en: {
      title: "Module advisor",
      catalogInfo: function (d) { return d.moduleCount + " modules · " + d.tagCount + " topics · catalog of " + d.compiledAt; },
      completedTitle: "Modules you already completed",
      completedDesc: "Record them once — every planning flow uses them.",
      searchPlaceholder: "Search module (code or title)…",
      noneYet: "None yet — that's fine, I'll plan from the start of your studies.",
      removeTitle: "Remove",
      clearAll: "Remove all",
      ectsLabel: "ECTS target per semester",
      flowsTitle: "What would you like to do?",
      flowPlan: "Plan my next semester",
      flowPlanDesc: "A concrete proposal matching your interests",
      flowPath: "Reach a target module",
      flowPathDesc: "Fastest path to a module you want",
      flowExplore: "Explore the catalog",
      flowExploreDesc: "Discover topics and matching modules",
      msgCompleted: function (codes) { return codes.length ? "Already completed: " + codes.join(", ") + "." : "I have not completed any modules yet."; },
      msgPlan: function (ects, completed) {
        return "Plan my next semester with a target of " + ects + " ECTS. " + completed +
          " Consider my interests if you know them from this chat — otherwise don't quiz me: " +
          "propose a balanced plan directly (mandatory and foundational modules first) and state " +
          "your assumptions briefly. Assemble a concrete clash-free plan from the catalog overview " +
          "and pass it as proposedModules to plan_semester.";
      },
      msgPath: function (completed) {
        return "I want to work toward a target module. " + completed +
          " First help me choose a fitting target module (ask about my interests), " +
          "then show me the fastest path to it with plan_path.";
      },
      msgExplore: function (completed) {
        return "Give me an overview of the module catalog: what topic areas exist, " +
          "and which modules could fit me? " + completed +
          " Feel free to ask me 2-3 questions about my interests.";
      },
      profileSummary: function (codes, ects) {
        return "Student profile from the start widget — completed modules: " +
          (codes.length ? codes.join(", ") : "none") + "; ECTS target: " + ects + ".";
      },
      noData: "No data — call get_started first."
    }
  };
  function t() { return isDe() ? STR.de : STR.en; }

  // Monochrome flow icons (inline SVG, currentColor) — platform-consistent,
  // unlike emoji which render differently on every host OS.
  var ICONS = {
    plan: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1.8" y="3" width="12.4" height="11.2" rx="2"/><path d="M1.8 7h12.4M5.2 1.6v2.8M10.8 1.6v2.8"/></svg>',
    path: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="2" fill="currentColor" stroke="none"/></svg>',
    explore: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14.4 14.4"/></svg>'
  };

  // ---------- state ----------
  var completed = {};   // code -> true
  var ects = 30;
  var query = "";
  var stateRestored = false;

  function data() { return Host.toolOutput; }

  function restoreState() {
    if (stateRestored) return;
    var ws = Host.widgetState;
    if (ws) {
      (ws.completed || []).forEach(function (c) { completed[c] = true; });
      if (typeof ws.ectsTarget === "number" && ws.ectsTarget > 0) ects = ws.ectsTarget;
    }
    if (data()) stateRestored = true;
  }

  function persistState() {
    var s = t();
    var codes = Object.keys(completed);
    Host.setState({ completed: codes, ectsTarget: ects }, s.profileSummary(codes, ects));
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function locTitle(m) { return (!isDe() && m.titleEn) ? m.titleEn : m.title; }
  function moduleByCode(code) {
    var d = data();
    if (!d) return null;
    for (var i = 0; i < d.modules.length; i++) {
      if (d.modules[i].code.toLowerCase() === code.toLowerCase()) return d.modules[i];
    }
    return null;
  }
  function matches(q) {
    var d = data();
    if (!d || !q) return [];
    var needle = q.toLowerCase();
    return d.modules.filter(function (m) {
      return !completed[m.code] && (
        m.code.toLowerCase().indexOf(needle) === 0 ||
        (m.title || "").toLowerCase().indexOf(needle) >= 0 ||
        (m.titleEn || "").toLowerCase().indexOf(needle) >= 0);
    }).slice(0, 8);
  }
  function completedSummary() {
    return t().msgCompleted(Object.keys(completed));
  }

  // ---------- rendering ----------
  function render() {
    hostRenderDeferred = false; // any render satisfies a pending host update
    restoreState();
    var root = document.getElementById("root");
    var d = data();
    var s = t();
    if (!d || !Array.isArray(d.modules)) {
      root.innerHTML = '<div class="empty">' + esc(Host.mode === "mcp" && !Host.ready ? "…" : s.noData) + "</div>";
      Host.reportSize();
      return;
    }

    var html = '<div class="header"><h1>' + esc(s.title) + "</h1>" +
      '<div class="sub">' + esc(d.program) + "</div></div>";
    html += '<div class="info-chips">' +
      '<span class="chip">' + esc(s.catalogInfo(d)) + "</span>" +
      (d.semesters || []).map(function (x) { return '<span class="chip">' + esc(x) + "</span>"; }).join("") +
      "</div>";

    // Completed modules: search + chips
    html += '<div class="section"><h2>' + esc(s.completedTitle) + "</h2>" +
      '<div class="desc">' + esc(s.completedDesc) + "</div>" +
      '<div class="picker"><input id="search" type="text" placeholder="' + esc(s.searchPlaceholder) +
      '" value="' + esc(query) + '" autocomplete="off">';
    var sugg = matches(query);
    if (sugg.length > 0) {
      html += '<div class="suggestions">' + sugg.map(function (m) {
        return '<button data-add="' + esc(m.code) + '"><span class="code">' + esc(m.code) + "</span>" +
          esc(locTitle(m)) + '<span class="ects">' + m.ects + " ECTS</span></button>";
      }).join("") + "</div>";
    }
    html += "</div>";
    var codes = Object.keys(completed);
    if (codes.length > 0) {
      html += '<div class="sel-chips">' + codes.map(function (c) {
        var m = moduleByCode(c);
        return '<span class="chip"><span class="chip-code">' + esc(c) + "</span>" +
          esc(m ? locTitle(m) : c) +
          (m ? '<span class="chip-ects">' + m.ects + " ECTS</span>" : "") +
          '<button data-remove="' + esc(c) + '" title="' + esc(s.removeTitle) + '">×</button></span>';
      }).join("") +
      (codes.length > 1
        ? '<button class="clear-all" data-clear="1">' + esc(s.clearAll) + "</button>"
        : "") +
      "</div>";
    } else {
      html += '<div class="none-note">' + esc(s.noneYet) + "</div>";
    }
    html += '<div class="target-row"><label for="ects">' + esc(s.ectsLabel) + "</label>" +
      '<input id="ects" type="number" min="1" max="90" step="1" value="' + ects + '"></div>';
    html += "</div>";

    // Flows
    html += '<div class="section"><h2>' + esc(s.flowsTitle) + "</h2><div class=\"flows\">" +
      '<button class="flow" data-flow="plan"><span class="flow-title"><span class="flow-ico" aria-hidden="true">' + ICONS.plan + "</span>" + esc(s.flowPlan) +
      '</span><div class="flow-desc">' + esc(s.flowPlanDesc) + "</div></button>" +
      '<button class="flow" data-flow="path"><span class="flow-title"><span class="flow-ico" aria-hidden="true">' + ICONS.path + "</span>" + esc(s.flowPath) +
      '</span><div class="flow-desc">' + esc(s.flowPathDesc) + "</div></button>" +
      '<button class="flow" data-flow="explore"><span class="flow-title"><span class="flow-ico" aria-hidden="true">' + ICONS.explore + "</span>" + esc(s.flowExplore) +
      '</span><div class="flow-desc">' + esc(s.flowExploreDesc) + "</div></button>" +
      "</div></div>";

    root.innerHTML = html;
    // Keep typing fluid: restore focus/caret after innerHTML rebuild.
    var input = document.getElementById("search");
    if (query && input) { input.focus(); input.setSelectionRange(query.length, query.length); }
    Host.reportSize();
  }

  // ---------- events ----------
  document.getElementById("root").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-add],[data-remove],[data-clear],[data-flow]");
    if (!el) return;
    var s = t();
    if (el.hasAttribute("data-add")) {
      completed[el.getAttribute("data-add")] = true;
      query = "";
      persistState();
      render();
    } else if (el.hasAttribute("data-remove")) {
      delete completed[el.getAttribute("data-remove")];
      persistState();
      render();
    } else if (el.hasAttribute("data-clear")) {
      completed = {};
      persistState();
      render();
    } else if (el.hasAttribute("data-flow")) {
      var flow = el.getAttribute("data-flow");
      var summary = completedSummary();
      if (flow === "plan") Host.sendMessage(s.msgPlan(ects, summary));
      else if (flow === "path") Host.sendMessage(s.msgPath(summary));
      else Host.sendMessage(s.msgExplore(summary));
    }
  });
  document.getElementById("root").addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.id === "search") { query = el.value; render(); }
    else if (el.id === "ects") {
      var v = parseInt(el.value, 10);
      if (v > 0) { ects = v; persistState(); }
    }
  });

  function applyTheme() {
    var theme = Host.theme ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  }

  // Host-triggered re-renders must never destroy a form control the student is
  // using: replacing an open <select> closes it before a choice can be made.
  // Defer the render until the control is committed or left; our own event
  // handlers keep calling render() directly (the dropdown is closed by then).
  var hostRenderDeferred = false;
  function hostRender() {
    var root = document.getElementById("root");
    var active = document.activeElement;
    if (active && root.contains(active) && (active.tagName === "SELECT" || active.tagName === "INPUT")) {
      if (hostRenderDeferred) return;
      hostRenderDeferred = true;
      var done = function (ev) {
        active.removeEventListener("blur", done);
        active.removeEventListener("change", done);
        hostRenderDeferred = false;
        // Focus moving to another element inside the widget (e.g. clicking an
        // autocomplete suggestion or a button): rendering right now would replace
        // the click target mid-gesture — let the click land first, then refresh.
        if (ev && ev.type === "blur" && ev.relatedTarget && root.contains(ev.relatedTarget)) {
          setTimeout(hostRender, 150);
          return;
        }
        render();
      };
      active.addEventListener("blur", done);
      active.addEventListener("change", done);
      return;
    }
    render();
  }

  Host.onchange = function () { applyTheme(); hostRender(); };

  applyTheme();
  render();
})();
</script>
</body>
</html>
