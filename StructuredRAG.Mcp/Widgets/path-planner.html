<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* FHNW design system × modern glass. Keep the token block in sync across
     all four widgets (start, module-comparer, path-planner, semester-planner).
     Palette and type cues come from fhnw.ch: yellow #fde70e (hover #fef16e),
     ink #141414, muted #767676, dark-olive #716800 as the yellow-on-white
     text stand-in, Poppins/Inter type stacks. Glassmorphism adds translucent,
     blurred panels, soft shadows and rounded geometry. Dark mode is its own
     selected set, not an automatic flip. The body stays transparent so the
     host's card background shows through; --surface is only for elements
     that need an opaque fill (inputs). */
  :root {
    color-scheme: light;
    --surface: #ffffff;
    --glass: rgba(255, 255, 255, 0.58);
    --glass-hi: rgba(255, 255, 255, 0.82);
    --glass-border: rgba(20, 20, 20, 0.10);
    --plane: rgba(20, 20, 20, 0.045);
    --ink: #141414;
    --ink-2: #535353;
    --muted: #767676;
    --hairline: rgba(20, 20, 20, 0.12);
    --ring: rgba(20, 20, 20, 0.22);
    --accent: #fde70e;
    --accent-hover: #fef16e;
    --accent-ink: #141414;
    --accent-text: #716800;
    --accent-soft: rgba(253, 231, 14, 0.16);
    --accent-edge: rgba(20, 20, 20, 0.35);
    --check: #141414;
    --warn: #b87e00;
    --good-text: #3d8730;
    --blur: saturate(1.6) blur(14px);
    --shadow: 0 10px 28px rgba(20, 20, 20, 0.10);
    --shadow-soft: 0 6px 18px rgba(20, 20, 20, 0.06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1f1f1f;
    --glass: rgba(30, 30, 30, 0.55);
    --glass-hi: rgba(48, 48, 48, 0.74);
    --glass-border: rgba(255, 255, 255, 0.12);
    --plane: rgba(255, 255, 255, 0.055);
    --ink: #ffffff;
    --ink-2: #c9c9c9;
    --muted: #999999;
    --hairline: rgba(255, 255, 255, 0.13);
    --ring: rgba(255, 255, 255, 0.24);
    --accent: #fde70e;
    --accent-hover: #feec38;
    --accent-ink: #141414;
    --accent-text: #fde70e;
    --accent-soft: rgba(253, 231, 14, 0.14);
    --accent-edge: rgba(253, 231, 14, 0.50);
    --check: #fde70e;
    --warn: #fab219;
    --good-text: #5ccb48;
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    color: var(--ink);
    font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Brand glow behind the glass — a hint of FHNW yellow for panels to
     refract; low alpha keeps the host card readable underneath. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(420px 240px at 95% -70px, rgba(253, 231, 14, 0.16), transparent 70%),
      radial-gradient(360px 260px at -90px 110%, rgba(253, 231, 14, 0.08), transparent 70%);
  }
  #root { padding: 16px 18px 14px; }
  button {
    font: inherit;
    color: var(--ink);
    background: var(--plane);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 5px 12px;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }
  button:hover { background: var(--glass-hi); border-color: var(--ring); transform: translateY(-1px); }
  button:active { transform: none; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: none;
    border-color: var(--accent-ink);
    box-shadow: 0 0 0 3px rgba(253, 231, 14, 0.45);
  }
  /* FHNW signature CTA: yellow fill, near-black text. */
  button.primary {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
    font-weight: 600; box-shadow: 0 4px 14px rgba(253, 231, 14, 0.35);
  }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .header h1 {
    position: relative; padding-left: 13px;
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em; margin: 0;
  }
  /* Yellow brand bar — echoes the mark in the FHNW logo. */
  .header h1::before {
    content: ""; position: absolute; left: 0; top: 0.16em; bottom: 0.12em;
    width: 5px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent-hover), var(--accent));
  }
  .header h1 .code { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .headline-chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0 2px; }
  .chip {
    display: inline-block; font-size: 11.5px; color: var(--ink-2);
    border: 1px solid var(--hairline); border-radius: 999px; padding: 0 8px; line-height: 18px;
    white-space: nowrap; background: var(--plane);
  }
  .chip.key {
    border-color: var(--accent-text); color: var(--accent-text);
    background: var(--accent-soft); font-weight: 600;
  }
  .chip.ects {
    font-variant-numeric: tabular-nums; font-weight: 600;
    background: #141414; color: #fde70e; border-color: transparent;
  }
  .chip.day { background: var(--plane); }
  .chip.req { border-color: var(--accent-text); color: var(--accent-text); background: var(--accent-soft); }
  .sem-pick {
    font: inherit; font-size: 12px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 3px 7px;
    margin-top: 4px; max-width: 100%;
    transition: border-color 0.12s ease, box-shadow 0.12s ease;
  }
  .sem-pick:hover { border-color: var(--accent); }
  #resetseq { font-size: 12px; padding: 3px 9px; }
  .done-line { font-size: 12.5px; color: var(--good-text); margin: 6px 0 0; }
  /* Alert strip: yellow brand bar on the left, like the heading. */
  .footer .err {
    border-left: 3px solid var(--accent);
    background: var(--plane); border-radius: 0 8px 8px 0;
    padding: 5px 9px;
  }
  .done-line .undo {
    border: none; padding: 0 3px; color: var(--muted); font-size: 12px; cursor: pointer; background: none;
  }
  .done-line .undo:hover { color: var(--ink); background: none; transform: none; }

  .timeline { margin-top: 12px; }
  .step { border-top: 1px solid var(--hairline); padding: 9px 0 4px; }
  .step-head { display: flex; align-items: baseline; gap: 8px; }
  .step-sem {
    font-family: "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 600; letter-spacing: -0.01em;
  }
  .step-ects { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .gap {
    border-top: 1px solid var(--hairline); color: var(--muted);
    font-size: 12px; padding: 7px 0; text-align: center;
  }
  .card {
    border: 1px solid var(--glass-border); border-radius: 14px;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    padding: 10px 12px; margin: 8px 0;
    box-shadow: var(--shadow-soft);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  .card.target { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent), var(--shadow-soft); }
  .card.target:hover { box-shadow: inset 4px 0 0 var(--accent), var(--shadow); }
  .card-row { display: flex; align-items: flex-start; gap: 8px; }
  .card-main { flex: 1 1 auto; min-width: 0; }
  .card-title { font-weight: 600; }
  .card-title .code { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .card-summary { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
  .card-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .card-actions { flex: none; display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
  .card-actions button { font-size: 12px; padding: 3px 9px; white-space: nowrap; }

  .details-panel {
    margin-top: 8px; padding: 9px 11px; font-size: 12.5px;
    border: 1px solid var(--glass-border); border-radius: 12px;
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    overflow-wrap: break-word; max-height: 260px; overflow-y: auto;
  }
  .details-panel a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
  .details-panel p { margin: 0 0 6px; }
  .details-panel p:last-child { margin-bottom: 0; }
  .details-panel ul { margin: 0 0 6px; padding-left: 18px; }
  .details-panel li { margin: 2px 0; }
  .details-panel .md-h { font-weight: 600; margin: 8px 0 4px; }
  .details-panel .md-h:first-child { margin-top: 0; }

  details.notes { margin-top: 12px; border-top: 1px solid var(--hairline); padding-top: 9px; }
  details.notes summary { cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 13px; }
  details.notes li { font-size: 12.5px; color: var(--ink-2); margin: 4px 0; }

  .footer {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border-top: 1px solid var(--hairline); margin-top: 14px; padding-top: 11px;
  }
  .footer .err { font-size: 12.5px; color: var(--ink-2); }
  .footer .spacer { flex: 1 1 auto; }
  .empty { color: var(--muted); padding: 18px 0; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  // ---------- host bridge ----------
  // Abstracts the two widget host conventions over one interface:
  //  - OpenAI Apps SDK (ChatGPT): window.openai globals + methods
  //  - MCP Apps extension (Claude, ...): JSON-RPC 2.0 over postMessage (spec 2026-01-26)
  var Host = (function () {
    var h = {
      mode: "none",       // "openai" | "mcp" | "none"
      ready: false,       // becomes true once host data has arrived (mcp is async)
      theme: null,
      locale: null,
      toolOutput: null,
      widgetState: null,  // openai only; MCP Apps has no widget-state store
      canCall: false,
      onchange: null,
      setState: function () {},
      callTool: function () { return Promise.reject(new Error("no host")); },
      sendMessage: function () {},
      openLink: function (url) { window.open(url, "_blank", "noopener"); },
      reportSize: function () {}
    };
    function notify() { if (h.onchange) h.onchange(); }

    if (window.openai) {
      var api = window.openai;
      h.mode = "openai";
      h.ready = true;
      h.theme = api.theme || null;
      h.locale = api.locale || null;
      h.toolOutput = api.toolOutput || null;
      h.widgetState = api.widgetState || null;
      h.canCall = typeof api.callTool === "function";
      h.setState = function (state, summary) {
        // Widget state persists between renders but is NOT reliably model-visible in
        // ChatGPT. Mirror the model-facing summary into the state snapshot and, where
        // the host supports ui/update-model-context, push it there too — otherwise a
        // profile recorded here never reaches the model unless a flow button is used.
        var snapshot = summary ? Object.assign({}, state, { modelSummary: summary }) : state;
        if (typeof api.setWidgetState === "function") api.setWidgetState(snapshot);
        // Always push — an empty summary must CLEAR previously pushed context
        // (a cleared draft would otherwise stay model-visible), like the MCP branch.
        if (typeof api.updateModelContext === "function") {
          try { api.updateModelContext({ content: summary ? [{ type: "text", text: summary }] : [] }); } catch (e) {}
        }
      };
      h.callTool = function (name, args) { return api.callTool(name, args); };
      h.sendMessage = function (text) { if (typeof api.sendFollowUpMessage === "function") api.sendFollowUpMessage({ prompt: text }); };
      h.openLink = function (url) {
        if (typeof api.openExternal === "function") api.openExternal({ href: url });
        else window.open(url, "_blank", "noopener");
      };
      // ChatGPT fires set_globals for many reasons (scroll, keyboard, layout
      // changes — very frequently on mobile). Re-rendering on every event snaps
      // open dropdowns shut mid-pick, so only notify when something the widget
      // actually renders from has changed.
      var sigOf = function () {
        var ws; try { ws = JSON.stringify(h.widgetState || null); } catch (e) { ws = ""; }
        return [h.theme, h.locale, ws].join("|");
      };
      var lastSig = sigOf();
      window.addEventListener("openai:set_globals", function () {
        var toolChanged = !!api.toolOutput && api.toolOutput !== h.toolOutput;
        h.theme = api.theme || h.theme;
        h.locale = api.locale || h.locale;
        h.toolOutput = api.toolOutput || h.toolOutput;
        h.widgetState = api.widgetState || h.widgetState;
        var sig = sigOf();
        if (!toolChanged && sig === lastSig) return;
        lastSig = sig;
        notify();
      });
    } else if (window.parent && window.parent !== window) {
      h.mode = "mcp";
      h.canCall = true;
      var nextId = 1, pending = {};
      var post = function (msg) { window.parent.postMessage(msg, "*"); };
      var request = function (method, params) {
        return new Promise(function (resolve, reject) {
          var id = nextId++;
          pending[id] = { resolve: resolve, reject: reject };
          post({ jsonrpc: "2.0", id: id, method: method, params: params });
        });
      };
      window.addEventListener("message", function (ev) {
        var m = ev.data;
        if (!m || m.jsonrpc !== "2.0") return;
        if (m.id !== undefined && m.method === undefined) {
          var p = pending[m.id];
          if (!p) return;
          delete pending[m.id];
          if (m.error) p.reject(new Error(m.error.message || "host error")); else p.resolve(m.result);
          return;
        }
        if (m.method === "ui/notifications/tool-result") {
          var pr = m.params || {};
          if (pr.structuredContent) { h.toolOutput = pr.structuredContent; h.ready = true; notify(); }
        } else if (m.method === "ui/notifications/host-context-changed") {
          var c = m.params || {};
          if (c.theme) h.theme = c.theme;
          if (c.locale) h.locale = c.locale;
          notify();
        }
      });
      h.setState = function (state, summary) {
        // Nearest MCP Apps equivalent of widget state: persist into the model
        // context (each request overwrites the previous one).
        request("ui/update-model-context", {
          structuredContent: state,
          content: summary ? [{ type: "text", text: summary }] : []
        }).catch(function () {});
      };
      h.callTool = function (name, args) { return request("tools/call", { name: name, arguments: args }); };
      h.sendMessage = function (text) {
        // MCP Apps expects content as a ContentBlock ARRAY — validating hosts
        // reject a bare object, and the send-to-chat buttons silently do nothing.
        request("ui/message", { role: "user", content: [{ type: "text", text: text }] }).catch(function () {});
      };
      h.openLink = function (url) { request("ui/open-link", { url: url }).catch(function () {}); };
      h.reportSize = function () {
        // Height comes from the content root, not documentElement.scrollHeight:
        // the latter is floored at the viewport, so once the host has grown the
        // frame the widget could never ask for a SMALLER one again — collapsing
        // a section would leave an oversized, mostly blank card in the chat.
        var root = document.getElementById("root");
        post({ jsonrpc: "2.0", method: "ui/notifications/size-changed",
               params: { width: document.documentElement.scrollWidth,
                         height: root ? Math.ceil(root.getBoundingClientRect().height)
                                      : document.documentElement.scrollHeight } });
      };
      request("ui/initialize", {
        protocolVersion: "2026-01-26",
        clientInfo: { name: "module-catalog-widget", version: "1.0.0" },
        capabilities: {},
        appCapabilities: {}
      }).then(function (res) {
        var ctx = (res && res.hostContext) || {};
        if (ctx.theme) h.theme = ctx.theme;
        if (ctx.locale) h.locale = ctx.locale;
        notify();
      }).catch(function () { notify(); });
    }
    return h;
  })();

  // ---------- i18n ----------
  function isDe() {
    var loc = Host.locale || "de";
    return String(loc).toLowerCase().indexOf("de") === 0;
  }
  var STR = {
    de: {
      title: function (t) { return "Weg zu: " + t; },
      earliest: function (s) { return "frühestens " + s; },
      semesters: function (n) { return n + (n === 1 ? " Semester" : " Semester"); },
      ects: "ECTS",
      alreadyDone: "✓ Bereits absolviert: ",
      undoTitle: "Als nicht absolviert markieren und neu planen",
      markDone: "✓ schon absolviert",
      targetBadge: "🎯 Ziel",
      details: "Details",
      hide: "Zuklappen",
      loading: "Lade offizielle Beschreibung…",
      loadError: "Details konnten nicht geladen werden.",
      official: "Offizielle Modulseite ↗",
      gap: function (n) { return "⏳ " + n + (n === 1 ? " Wartesemester" : " Wartesemester") + " (kein passendes Angebot)"; },
      requiredFor: function (codes) { return "→ benötigt für " + codes; },
      recommendedNote: function (codes) { return "Empfohlen (nicht zwingend): " + codes; },
      chooseSem: "Semester wählen",
      recommendedSeq: function (sem) { return "empfohlen: " + sem; },
      resetSeq: "↺ Empfohlene Abfolge",
      resetSeqTitle: "Alle Verschiebungen zurücksetzen",
      notes: function (n) { return "Hinweise (" + n + ")"; },
      send: "Pfad in den Chat senden",
      noData: "Keine Pfaddaten — bitte zuerst plan_path aufrufen.",
      replanFailed: "Neu planen fehlgeschlagen — Pfad unverändert.",
      followUp: function (title, pathText, sem, ects) {
        return "Mein schnellster Weg zu «" + title + "» laut Pfad-Widget:\n" + pathText +
          "\nFrühester Abschluss: " + sem + " (" + ects + " ECTS insgesamt). " +
          "Bitte prüfe den Pfad und hilf mir, das erste Semester konkret zu planen.";
      }
    },
    en: {
      title: function (t) { return "Path to: " + t; },
      earliest: function (s) { return "earliest " + s; },
      semesters: function (n) { return n + (n === 1 ? " semester" : " semesters"); },
      ects: "ECTS",
      alreadyDone: "✓ Already completed: ",
      undoTitle: "Mark as not completed and re-plan",
      markDone: "✓ already done",
      targetBadge: "🎯 Target",
      details: "Details",
      hide: "Hide",
      loading: "Loading official description…",
      loadError: "Could not load details.",
      official: "Official module page ↗",
      gap: function (n) { return "⏳ " + n + (n === 1 ? " waiting semester" : " waiting semesters") + " (no matching offering)"; },
      requiredFor: function (codes) { return "→ required for " + codes; },
      recommendedNote: function (codes) { return "Recommended (not required): " + codes; },
      chooseSem: "Choose semester",
      recommendedSeq: function (sem) { return "recommended: " + sem; },
      resetSeq: "↺ Recommended sequence",
      resetSeqTitle: "Reset all deferrals",
      notes: function (n) { return "Notes (" + n + ")"; },
      send: "Send path to chat",
      noData: "No path data — call plan_path first.",
      replanFailed: "Re-planning failed — path unchanged.",
      followUp: function (title, pathText, sem, ects) {
        return "My fastest path to \"" + title + "\" according to the path widget:\n" + pathText +
          "\nEarliest completion: " + sem + " (" + ects + " ECTS total). " +
          "Please review the path and help me plan the first semester concretely.";
      }
    }
  };
  function t() { return isDe() ? STR.de : STR.en; }
  var DAYS = {
    de: { Monday: "Mo", Tuesday: "Di", Wednesday: "Mi", Thursday: "Do", Friday: "Fr", Saturday: "Sa", Sunday: "So" },
    en: { Monday: "Mon", Tuesday: "Tue", Wednesday: "Wed", Thursday: "Thu", Friday: "Fri", Saturday: "Sat", Sunday: "Sun" }
  };
  function day(d) { return (isDe() ? DAYS.de : DAYS.en)[d] || d; }

  // ---------- state ----------
  var current = null;      // PathPlanData — starts as toolOutput, replaced by re-plans
  var busy = false;
  var errorMsg = null;
  var initialized = false;
  var expanded = {};       // code -> details panel open
  var details = {};        // code -> {loading|error|text,url}
  var notesOpen = false;   // survives re-renders (hosts re-render on any global change)
  var deferred = {};       // code -> slot the student chose instead of the earliest one

  function init() {
    if (initialized) return;
    var d = Host.toolOutput;
    if (!d || !Array.isArray(d.steps)) return;
    current = d;
    initialized = true;
    // Restore choices changed in an earlier turn (openai widget state only).
    // Deferrals are scoped to the exact path they were made for: a delay chosen
    // for a shared prerequisite in an earlier path (different target or start)
    // must not silently reshape a newly rendered one.
    var ws = Host.widgetState;
    if (ws && ws.deferred && typeof ws.deferred === "object"
        && ws.target === current.targetCode && ws.start === current.startSemester) {
      Object.keys(ws.deferred).forEach(function (c) {
        if (typeof ws.deferred[c] === "number") deferred[c] = ws.deferred[c];
      });
    }
    var saved = ws && Array.isArray(ws.completed) ? ws.completed : null;
    if (saved && saved.join("|") !== (current.completedModules || []).join("|")) replan(saved);
  }

  function persistState() {
    var state = { completed: current.completedModules || [] };
    if (Object.keys(deferred).length > 0) {
      state.deferred = deferred;
      state.target = current.targetCode;
      state.start = current.startSemester;
    }
    Host.setState(state, pathSummary());
  }

  // Model-facing one-liner (used as MCP Apps model context); reflects the
  // student's chosen sequence, not just the server's earliest-possible one.
  function pathSummary() {
    if (!current) return "";
    var view = schedule(deferred);
    var stepsText = view.steps.map(function (s) {
      return s.semester + ": " + s.modules.map(function (m) { return m.code; }).join("+");
    }).join(" -> ");
    return "Path to " + current.targetCode + " (widget, student's chosen sequence): " + stepsText +
      "; completion " + view.earliest + ", " + current.totalEcts + " ECTS total.";
  }

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Minimal markdown for the fetch text (headings, bold, bullets). The input is
  // escaped up front, so the transforms below only ever emit our own tags.
  function mdHtml(md) {
    var out = [], list = null, m;
    esc(md).split(/\r?\n/).forEach(function (line) {
      line = line.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      if ((m = /^\s*[-*•]\s+(.*)$/.exec(line))) {
        (list = list || []).push("<li>" + m[1] + "</li>");
        return;
      }
      if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
      if ((m = /^\s*#{1,4}\s+(.*)$/.exec(line))) out.push('<div class="md-h">' + m[1] + "</div>");
      else if (/\S/.test(line)) out.push("<p>" + line + "</p>");
    });
    if (list) out.push("<ul>" + list.join("") + "</ul>");
    return out.join("");
  }
  function locTitle(m) { return (!isDe() && m.titleEn) ? m.titleEn : m.title; }
  function locSummary(m) { return (!isDe() && m.summaryEn) ? m.summaryEn : m.summary; }
  function extractStructured(res) {
    if (!res) return null;
    var sc = res.structuredContent || (res.result && res.result.structuredContent);
    if (sc) return sc;
    var content = res.content || (res.result && res.result.content);
    if (Array.isArray(content)) {
      var text = content.map(function (c) { return c && c.text ? c.text : ""; }).join("\n");
      if (text) {
        try { return JSON.parse(text); } catch (e) { return null; }
      }
    }
    return null;
  }

  // ---------- client-side scheduling ----------
  // The server plans every module into its earliest possible slot; the student may
  // deviate by deferring modules to later semesters. Rescheduling uses the same
  // deterministic algorithm (prerequisite order + HS/FS offering rhythm), so it can
  // run client-side without a tool call. With no deferrals it reproduces the
  // server's plan exactly.
  function anchorIsHs() {
    var st = current.startSemester || "HS";
    return (st.length === 4 ? st.slice(2) : st).toUpperCase() === "HS";
  }
  function slotType(i) { return ((i % 2 === 0) === anchorIsHs()) ? "HS" : "FS"; }
  function slotLabel(i) {
    var st = current.startSemester || "HS";
    if (st.length !== 4) return "Semester " + (i + 1) + " (" + slotType(i) + ")";
    var year = parseInt(st.slice(0, 2), 10), isHs = st.slice(2).toUpperCase() === "HS";
    for (var k = 0; k < i; k++) { if (isHs) { year++; isHs = false; } else isHs = true; }
    return (year < 10 ? "0" + year : String(year)) + (isHs ? "HS" : "FS");
  }
  // Steps come slot-ordered, so flattening them is a topological order (a
  // prerequisite always sits in an earlier slot than its dependent).
  function planModules() {
    var out = [];
    (current.steps || []).forEach(function (st) { (st.modules || []).forEach(function (m) { out.push(m); }); });
    return out;
  }
  // Prerequisite groups: inner lists are interchangeable variants (OR); a group
  // constrains a module only through its EARLIEST placed member — a slower sibling
  // placed for another module's group must not delay a group that is already
  // satisfied. Modules absent from the plan (completed or not needed) never constrain.
  function groupsOf(m) {
    return m.prerequisiteGroups || (m.prerequisites || []).map(function (p) { return [p]; });
  }
  // Flat view for display maps ("required for" chips).
  function prereqCodes(m) {
    var out = [];
    groupsOf(m).forEach(function (g) { g.forEach(function (p) { out.push(p); }); });
    return out;
  }
  // Earliest slot allowed by the groups, given placed (code -> slot); excludeSelf
  // guards against a module listed in its own group data.
  function groupFloor(m, placed) {
    var min = 0;
    groupsOf(m).forEach(function (g) {
      var best = null;
      g.forEach(function (p) {
        var k = p.toLowerCase();
        if (k === m.code.toLowerCase()) return;
        if (placed[k] !== undefined && (best === null || placed[k] < best)) best = placed[k];
      });
      if (best !== null) min = Math.max(min, best + 1);
    });
    return min;
  }
  function offeringTypes(m) {
    var types = (m.offeredIn || []).map(function (x) { return String(x).toUpperCase(); });
    if (types.length === 0) (m.offerings || []).forEach(function (o) {
      var ty = String(o.semesterId || "").slice(-2).toUpperCase();
      if ((ty === "HS" || ty === "FS") && types.indexOf(ty) < 0) types.push(ty);
    });
    return types;
  }
  // First slot >= the given one matching the module's offering rhythm (modules
  // without offering info are unconstrained, like on the server).
  function fitSlot(m, slot) {
    var types = offeringTypes(m);
    if (types.length === 0) return slot;
    while (types.indexOf(slotType(slot)) < 0) slot++;
    return slot;
  }
  function schedule(overrides) {
    var placed = {};
    planModules().forEach(function (m) {
      var slot = fitSlot(m, groupFloor(m, placed));
      var want = overrides[m.code];
      if (typeof want === "number" && want > slot) slot = fitSlot(m, want);
      placed[m.code.toLowerCase()] = slot;
    });
    var bySlot = {};
    planModules().forEach(function (m) {
      var sl = placed[m.code.toLowerCase()];
      (bySlot[sl] = bySlot[sl] || []).push(m);
    });
    var steps = Object.keys(bySlot).map(Number).sort(function (a, b) { return a - b; })
      .map(function (sl) {
        var ms = bySlot[sl];
        return { slot: sl, semester: slotLabel(sl), modules: ms,
                 ects: ms.reduce(function (a, m) { return a + (m.ects || 0); }, 0) };
      });
    var tSlot = placed[current.targetCode.toLowerCase()];
    return { steps: steps, placed: placed, earliest: slotLabel(tSlot), semesterCount: tSlot + 1 };
  }
  // The semester options offered for one module: its earliest valid slot (given
  // where its prerequisites currently sit) plus the next few offering-compatible ones.
  function slotChoices(m, view) {
    var out = [], slot = fitSlot(m, groupFloor(m, view.placed));
    while (out.length < 5) {
      out.push(slot);
      var next = fitSlot(m, slot + 1);
      if (next === slot) break;
      slot = next;
    }
    return out;
  }
  // Weekday chips must reflect the semester the module is placed in — schedules can
  // differ between HS and FS, and after a deferral the server-narrowed weekdays
  // (computed for the earliest slot) may be wrong. Re-derive them from the offerings
  // matching the placed semester; no matching offering -> no chips (accurate) rather
  // than a misleading day. The HS/FS-type fallback applies only to generic starts:
  // with a concrete start, a slot beyond the compiled offerings is a semester whose
  // schedule is simply unknown — showing an older year's weekday would mislead.
  // Catalogs without offering records keep the summary days.
  function weekdaysFor(m, slot) {
    var offs = m.offerings || [];
    if (offs.length === 0) return m.weekdays || [];
    var label = slotLabel(slot).toUpperCase(), type = slotType(slot);
    var concrete = (current.startSemester || "").length === 4;
    var match = offs.filter(function (o) { return String(o.semesterId || "").toUpperCase() === label; });
    if (!match.length && !concrete) match = offs.filter(function (o) { return String(o.semesterId || "").toUpperCase().slice(-2) === type; });
    var days = [];
    match.forEach(function (o) {
      (o.weekdays || []).forEach(function (d) { if (days.indexOf(d) < 0) days.push(d); });
    });
    return days;
  }

  // code -> plan modules that directly require it (why is this module in the path?).
  function requiredForMap() {
    var map = {};
    planModules().forEach(function (m) {
      // Both variants of a group map to m — only the placed one's entry is ever read.
      prereqCodes(m).forEach(function (p) {
        var k = p.toLowerCase();
        (map[k] = map[k] || []).push(m.code);
      });
    });
    return map;
  }

  // ---------- rendering ----------
  function render() {
    hostRenderDeferred = false; // any render satisfies a pending host update
    init();
    var root = document.getElementById("root");
    var s = t();
    if (!current) {
      root.innerHTML = '<div class="empty">' + esc(Host.mode === "mcp" && !Host.ready ? "…" : s.noData) + "</div>";
      Host.reportSize();
      return;
    }

    var base = schedule({});
    var view = schedule(deferred);
    var reqFor = requiredForMap();
    var deviates = JSON.stringify(view.placed) !== JSON.stringify(base.placed);

    var targetTitle = (!isDe() && current.targetTitleEn) ? current.targetTitleEn : current.targetTitle;
    var html = '<div class="header"><h1>' + esc(s.title(targetTitle)) +
      '<span class="code">' + esc(current.targetCode) + "</span></h1></div>";

    var delayed = view.earliest !== base.earliest;
    html += '<div class="headline-chips">' +
      '<span class="chip key">' + esc(delayed ? view.earliest : s.earliest(view.earliest)) + "</span>" +
      (delayed ? '<span class="chip">' + esc(s.recommendedSeq(base.earliest)) + "</span>" : "") +
      '<span class="chip">' + esc(s.semesters(view.semesterCount)) + "</span>" +
      '<span class="chip ects">' + current.totalEcts + " " + esc(s.ects) + "</span>" +
      (deviates ? '<button id="resetseq" title="' + esc(s.resetSeqTitle) + '">' + esc(s.resetSeq) + "</button>" : "") +
      "</div>";

    if ((current.alreadyCompleted || []).length > 0) {
      html += '<div class="done-line" role="status">' + esc(s.alreadyDone) +
        current.alreadyCompleted.map(function (c) {
          return esc(c) + '<button class="undo" data-undo="' + esc(c) + '" title="' + esc(s.undoTitle) + '">×</button>';
        }).join(", ") + "</div>";
    }

    html += '<div class="timeline">';
    var prevSlot = -1;
    view.steps.forEach(function (step) {
      if (prevSlot >= 0 && step.slot - prevSlot > 1) {
        html += '<div class="gap">' + esc(t().gap(step.slot - prevSlot - 1)) + "</div>";
      }
      prevSlot = step.slot;

      html += '<div class="step"><div class="step-head">' +
        '<span class="step-sem">' + esc(step.semester) + "</span>" +
        '<span class="step-ects">' + step.ects + " " + esc(s.ects) + "</span></div>";

      step.modules.forEach(function (m) {
        var isTarget = m.code === current.targetCode;
        var needs = reqFor[m.code.toLowerCase()] || [];
        html += '<div class="card' + (isTarget ? " target" : "") + '">' +
          '<div class="card-row"><div class="card-main">' +
          '<div class="card-title">' + esc(locTitle(m)) + '<span class="code">' + esc(m.code) + "</span></div>" +
          '<div class="badges">' +
          (isTarget ? '<span class="chip key">' + esc(s.targetBadge) + "</span>" : "") +
          '<span class="chip ects">' + m.ects + " " + esc(s.ects) + "</span>" +
          weekdaysFor(m, step.slot).map(function (w) { return '<span class="chip day">' + esc(day(w)) + "</span>"; }).join("") +
          (needs.length ? '<span class="chip req">' + esc(s.requiredFor(needs.join(", "))) + "</span>" : "") +
          "</div>" +
          '<div class="card-summary">' + esc(locSummary(m)) + "</div>" +
          ((m.recommended || []).length
            ? '<div class="card-note">' + esc(s.recommendedNote(m.recommended.join(", "))) + "</div>" : "") +
          semPicker(m, view) +
          "</div>" +
          '<div class="card-actions">' +
          '<button data-details="' + esc(m.code) + '">' + esc(expanded[m.code] ? s.hide : s.details) + "</button>" +
          (isTarget ? "" : '<button data-done="' + esc(m.code) + '"' + (busy ? " disabled" : "") + ">" + esc(s.markDone) + "</button>") +
          "</div></div>" +
          detailsPanel(m) +
          "</div>";
      });
      html += "</div>";
    });
    html += "</div>";

    if ((current.notes || []).length > 0) {
      html += '<details class="notes"' + (notesOpen ? " open" : "") + "><summary>" + esc(s.notes(current.notes.length)) + "</summary><ul>" +
        current.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("") + "</ul></details>";
    }

    html += '<div class="footer">' +
      (errorMsg ? '<span class="err" role="alert">' + esc(errorMsg) + "</span>" : "") +
      '<span class="spacer"></span>' +
      '<button id="send" class="primary"' + (busy ? " disabled" : "") + ">" + esc(s.send) + "</button>" +
      "</div>";

    root.innerHTML = html;
    Host.reportSize();
  }

  function detailsPanel(m) {
    if (!expanded[m.code]) return "";
    var s = t();
    var st = details[m.code];
    var body;
    if (!st || st.loading) body = "<p>" + esc(s.loading) + "</p>";
    else if (st.error) body = "<p>" + esc(s.loadError) + (m.url ? " " + linkHtml(m.url, s.official) : "") + "</p>";
    else body = mdHtml(st.text) + (st.url || m.url ? "<p>" + linkHtml(st.url || m.url, s.official) + "</p>" : "");
    return '<div class="details-panel">' + body + "</div>";
  }
  function linkHtml(url, label) {
    return '<a href="' + esc(url) + '" data-open="' + esc(url) + '">' + esc(label) + "</a>";
  }

  // Semester selector: lets the student defer a module to a later offering instead
  // of following the recommended earliest slot; dependents and the completion
  // semester recompute deterministically on change.
  function semPicker(m, view) {
    var s = t();
    var choices = slotChoices(m, view);
    var cur = view.placed[m.code.toLowerCase()];
    if (choices.indexOf(cur) < 0) { choices.push(cur); choices.sort(function (a, b) { return a - b; }); }
    if (choices.length < 2) return "";
    var html = '<div><select class="sem-pick" data-defer="' + esc(m.code) + '" title="' + esc(s.chooseSem) + '">';
    choices.forEach(function (sl) {
      html += '<option value="' + sl + '"' + (sl === cur ? " selected" : "") + ">" + esc(slotLabel(sl)) + "</option>";
    });
    return html + "</select></div>";
  }

  // ---------- actions ----------
  function replan(newCompleted) {
    if (!Host.canCall || !current) { errorMsg = t().replanFailed; render(); return; }
    busy = true;
    errorMsg = null;
    render();
    Host.callTool("plan_path", {
      targetModule: current.targetCode,
      completedModules: newCompleted,
      startSemester: current.startSemester
    }).then(function (res) {
      var sc = extractStructured(res);
      busy = false;
      if (sc && Array.isArray(sc.steps)) {
        current = sc;
        persistState();
      } else {
        errorMsg = t().replanFailed;
      }
      render();
    }).catch(function () {
      busy = false;
      errorMsg = t().replanFailed;
      render();
    });
  }

  function markDone(code) {
    if (busy) return;
    var completed = (current.completedModules || []).slice();
    if (completed.some(function (c) { return c.toLowerCase() === code.toLowerCase(); })) return;
    completed.push(code);
    replan(completed);
  }

  function unmarkDone(code) {
    if (busy) return;
    replan((current.completedModules || []).filter(function (c) {
      return c.toLowerCase() !== code.toLowerCase();
    }));
  }

  function toggleDetails(code) {
    if (expanded[code]) { delete expanded[code]; render(); return; }
    expanded[code] = true;
    if (!details[code] && Host.canCall) {
      details[code] = { loading: true };
      Host.callTool("fetch", { id: code }).then(function (res) {
        var sc = extractStructured(res);
        details[code] = sc && sc.text ? { text: sc.text, url: sc.url || null } : { error: true };
        render();
      }).catch(function () {
        details[code] = { error: true };
        render();
      });
    } else if (!details[code]) {
      details[code] = { error: true };
    }
    render();
  }

  function sendPath() {
    if (!current) return;
    var s = t();
    var view = schedule(deferred);
    var targetTitle = (!isDe() && current.targetTitleEn) ? current.targetTitleEn : current.targetTitle;
    var lines = view.steps.map(function (step) {
      return "- " + step.semester + ": " +
        step.modules.map(function (m) { return m.code + " (" + m.ects + " ECTS)"; }).join(", ");
    }).join("\n");
    Host.sendMessage(s.followUp(targetTitle, lines, view.earliest, current.totalEcts));
  }

  // ---------- events ----------
  // "toggle" does not bubble — listen in the capture phase. Without this, any
  // re-render (hosts fire global updates constantly) rebuilds the <details>
  // element in its default collapsed state right after the user opens it.
  document.getElementById("root").addEventListener("toggle", function (ev) {
    if (ev.target.matches && ev.target.matches("details.notes")) notesOpen = ev.target.open;
  }, true);
  document.getElementById("root").addEventListener("click", function (ev) {
    var el = ev.target.closest("[data-details],[data-done],[data-undo],[data-open],#send,#resetseq");
    if (!el) return;
    if (el.hasAttribute("data-details")) toggleDetails(el.getAttribute("data-details"));
    else if (el.hasAttribute("data-done")) markDone(el.getAttribute("data-done"));
    else if (el.hasAttribute("data-undo")) unmarkDone(el.getAttribute("data-undo"));
    else if (el.hasAttribute("data-open")) {
      ev.preventDefault();
      Host.openLink(el.getAttribute("data-open"));
    }
    else if (el.id === "send") sendPath();
    else if (el.id === "resetseq") { deferred = {}; persistState(); render(); }
  });
  document.getElementById("root").addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.hasAttribute && el.hasAttribute("data-defer")) {
      var slot = parseInt(el.value, 10);
      if (!isNaN(slot)) { deferred[el.getAttribute("data-defer")] = slot; persistState(); render(); }
    }
  });

  function applyTheme() {
    var theme = Host.theme ||
      (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = theme;
  }

  // Host-triggered re-renders must never destroy a form control the student is
  // using: replacing an open <select> closes it before a choice can be made.
  // Defer the render until the control is committed or left; our own event
  // handlers keep calling render() directly (the dropdown is closed by then).
  var hostRenderDeferred = false;
  function hostRender() {
    var root = document.getElementById("root");
    var active = document.activeElement;
    if (active && root.contains(active) && (active.tagName === "SELECT" || active.tagName === "INPUT")) {
      if (hostRenderDeferred) return;
      hostRenderDeferred = true;
      var done = function (ev) {
        active.removeEventListener("blur", done);
        active.removeEventListener("change", done);
        hostRenderDeferred = false;
        // Focus moving to another element inside the widget (e.g. clicking an
        // autocomplete suggestion or a button): rendering right now would replace
        // the click target mid-gesture — let the click land first, then refresh.
        if (ev && ev.type === "blur" && ev.relatedTarget && root.contains(ev.relatedTarget)) {
          setTimeout(hostRender, 150);
          return;
        }
        render();
      };
      active.addEventListener("blur", done);
      active.addEventListener("change", done);
      return;
    }
    render();
  }

  Host.onchange = function () { applyTheme(); hostRender(); };

  applyTheme();
  render();
})();
</script>
</body>
</html>
