# Browser tests for the MCP widget HTML. The widgets are shipped as embedded
# resources and have no other automated coverage, so this is what stops a
# host/widget interaction regression (scroll timing, frame sizing) from reaching
# a student.
name: Widget tests

on:
  pull_request:
    paths:
      - "StructuredRAG.Mcp/Widgets/**"
      - "tests/widgets/**"
      - ".github/workflows/widget-tests.yml"
  push:
    branches: [main]
    paths:
      - "StructuredRAG.Mcp/Widgets/**"
      - "tests/widgets/**"
      - ".github/workflows/widget-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/widgets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/widgets/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only chromium: the widgets run in host webviews, all Chromium-based.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Run widget tests
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/widgets/playwright-report
          retention-days: 7
